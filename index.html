<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RawNotes Triage version __VERSION__</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1d1d1b;--mute:#6c6a63;--line:#e2e0d8;--acc:#2d63c8;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;--soft:#eef1f8;--g0:#ebedf0;--g1:#9be9a8;--g2:#40c463;--g3:#30a14e;--g4:#216e39}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--panel:#1f1f1c;--ink:#ece9e1;--mute:#9b988f;--line:#33322d;--acc:#7ea2ea;--ok:#5fc48a;--warn:#e0a94c;--bad:#ea6b5b;--soft:#26292f;--g0:#2a2a26;--g1:#0e4429;--g2:#006d32;--g3:#26a641;--g4:#39d353}}
*{box-sizing:border-box}body{height:100vh;display:flex;flex-direction:column;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0}header .stats{color:var(--mute);font-size:13px}header .stats b{color:var(--ink)}
.inflight{padding:8px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.inflight .chip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;background:var(--panel);cursor:pointer}
.chip.late{border-color:var(--bad);color:var(--bad)}.chip.soon{border-color:var(--warn)}.chip.done{opacity:.55;text-decoration:line-through}
main{display:grid;grid-template-columns:360px 1fr;flex:1;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:none;padding:8px;color:var(--mute);cursor:pointer;font:inherit}
.tabs button.on{color:var(--ink);border-bottom:2px solid var(--acc)}
.row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.row:hover{background:var(--soft)}.row.sel{background:var(--soft);box-shadow:inset 3px 0 var(--acc)}
.row .t{font-weight:600}.row .m{grid-column:1/-1;color:var(--mute);font-size:12px}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mute);height:fit-content}
.badge.open{color:var(--acc);border-color:var(--acc)}.badge.cooking{color:var(--warn);border-color:var(--warn)}
.badge.dead{color:var(--bad);border-color:var(--bad)}.badge.promoted{color:var(--ok);border-color:var(--ok)}
.stale{color:var(--bad);font-weight:600}
.badge.nodone{color:var(--bad);border-color:var(--bad)}
.badge.gh{font-weight:700;margin-right:6px}.badge.gh.ok{color:var(--ok);border-color:var(--ok)}.badge.gh.warn{color:var(--warn);border-color:var(--warn)}.badge.gh.no{color:var(--bad);border-color:var(--bad)}
.dod{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:8px 14px;margin:12px 0;background:var(--panel)}
.dod h2{margin:0 0 4px;border:0;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.dod p{margin:0}.dod.missing{border-color:var(--bad);border-left-color:var(--bad)}.dod.missing h2,.dod.missing p{color:var(--bad)}
.dod .meta{font-size:12px;margin-top:4px}
.dod .dodhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.dod .dodhead h2{margin:0}
.dod .dodhead .act{padding:1px 10px;font-size:12px}
.dod textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.dod .dodbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.dod .dodbtns .err{color:var(--bad);font-size:13px}
.dod.confirm{border-left-color:var(--warn)}.dod .dodcmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.dod .dodcmp b{font-size:12px;color:var(--mute)}.dod .dodcmp .old{text-decoration:line-through;color:var(--mute)}
.dod .dodbtns .act.go{background:var(--ok);color:#fff;border-color:var(--ok)}
section{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.decide{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.decide .btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
button.act{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.act:hover{background:var(--soft)}button.act.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.form{display:none;margin-top:8px;display:grid;gap:8px;grid-template-columns:auto 1fr;align-items:center;max-width:720px}
.form label{color:var(--mute);font-size:13px}.form input,.form select,.form textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.form .go{grid-column:2;display:flex;gap:10px;align-items:center}
.go button{background:var(--ok);color:#fff;border:0;padding:8px 18px;border-radius:6px;font:inherit;cursor:pointer}
.go button.danger{background:var(--bad)}.go .kbd{color:var(--mute);font-size:12px}
.toast{color:var(--ok);font-size:13px;margin-left:8px}.toast.err{color:var(--bad)}
article{overflow:auto;padding:18px 28px;max-width:900px}
article h1{font-size:22px}article h2{font-size:16px;margin-top:22px;border-bottom:1px solid var(--line)}article h3{font-size:14px}
article pre{background:var(--soft);padding:10px;border-radius:6px;overflow:auto}article code{background:var(--soft);padding:1px 4px;border-radius:4px}
article a{color:var(--acc)}article ul{padding-left:20px}article .meta{color:var(--mute)}
.activity{padding:8px 18px;border-bottom:1px solid var(--line);display:flex;gap:6px 24px;flex-wrap:wrap;align-items:flex-start;font-size:13.8px;color:var(--mute)}
.activity .graph{overflow-x:auto;max-width:100%;padding-bottom:2px}
.activity .months,.activity .cells{display:grid;grid-auto-columns:10px;column-gap:3px}
.activity .months{height:17px;line-height:17px;white-space:nowrap}
.activity .cells{grid-template-rows:repeat(7,10px);grid-auto-flow:column;gap:3px}
.activity .cells i{width:10px;height:10px;border-radius:2px;background:var(--g0);outline:1px solid rgba(128,128,128,.12);outline-offset:-1px}
.activity .cells i.l1{background:var(--g1)}.activity .cells i.l2{background:var(--g2)}.activity .cells i.l3{background:var(--g3)}.activity .cells i.l4{background:var(--g4)}
.activity .cells i.today{outline:1px solid var(--ink)}
.activity .side{flex:1;min-width:220px}.activity .side b{color:var(--ink)}
.activity .legend{display:inline-flex;gap:3px;align-items:center;margin-left:8px}.activity .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.activity .repos{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.activity .repos>span{white-space:nowrap}
.activity .repos a{border:1px solid var(--line);border-radius:12px;padding:1px 9px;background:var(--panel);color:var(--ink);text-decoration:none}
.activity .repos a:hover{border-color:var(--acc)}.activity .repos a em{font-style:normal;color:var(--mute)}
.activity .err{color:var(--bad)}.activity button{font:inherit;font-size:12.65px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer}
.repohead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.crumbs{margin:2px 0 10px;color:var(--mute);overflow-wrap:anywhere}.crumbs a{color:var(--acc);text-decoration:none}
.repofiles{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.repofiles a{display:grid;grid-template-columns:24px 1fr auto;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;align-items:center}
.repofiles a:last-child{border-bottom:0}.repofiles a:hover{background:var(--soft)}.repofiles em{font-style:normal;color:var(--mute);font-size:12px}
.copy-path{cursor:pointer}.copy-path:hover{text-decoration:underline}
.empty{color:var(--mute);padding:40px;text-align:center}
#back{display:none}
@media(max-width:800px){ /* phone: list and note are two pages, toggled by body.note */
body{height:auto;display:block}#hint{display:none}main{display:block;height:auto}aside{border-right:0}section{display:none}
body.note aside{display:none}body.note section{display:block;overflow:visible}
#back{display:block;margin:10px 16px;min-height:44px}
.tabs{overflow-x:auto}.tabs button{flex:1 0 auto;min-height:44px;white-space:nowrap}
.row{min-width:0}.row .t,.row .m{overflow-wrap:anywhere}.row-copy{min-height:32px}
.repofiles a{min-height:44px}.repohead .act{min-height:44px}.dod textarea{font-size:16px}.dod .act{min-height:44px}.dod .dodhead .act{min-height:36px}.dod .dodcmp{grid-template-columns:1fr}
.activity{padding:8px 16px}.activity .side{min-width:0;width:100%}.activity .repos{flex-wrap:nowrap;overflow-x:auto}.activity .repos a{white-space:nowrap}
.inflight{overflow-x:auto;flex-wrap:nowrap}.inflight>b,.inflight .chip{white-space:nowrap}.inflight .chip{cursor:default}
.decide{position:fixed;left:0;right:0;bottom:0;z-index:2;max-height:65vh;overflow:auto;border-top:1px solid var(--line);border-bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.decide .btns{display:grid;grid-template-columns:1fr 1fr}.decide .btns button.act{min-height:44px;padding:6px 10px}
.form{grid-template-columns:1fr;max-width:none}.form .go{grid-column:1;flex-wrap:wrap}.form input,.form select,.form textarea{font-size:16px;min-height:44px;width:100%!important}.go button{min-height:44px}
article{overflow:visible;padding:14px 16px 240px;overflow-wrap:anywhere}article pre{max-width:100%}
}
</style></head><body>
<header><h1>RawNotes Triage version __VERSION__</h1><div class="stats" id="stats"></div>
<span style="flex:1"></span><span class="stats" id="hint">Keys: j/k next/prev · p promote · d durable · a archive · c keep · y copy path · Enter apply</span></header>
<div class="activity" id="activity"><span>Loading GitHub activity…</span></div>
<div class="inflight" id="inflight"></div>
<main>
<aside><div class="tabs"><button class="on" data-tab="live">Backlog</button><button data-tab="done">Done</button><button data-tab="projects">Active Projects</button></div><div id="list"></div></aside>
<section>
<button class="act" id="back" onclick="back()">← Backlog</button>
<div class="decide" id="decide"><div class="empty">Pick a note to review.</div></div>
<article id="view"><div class="empty">Oldest first. Decide one, move on.</div></article>
</section></main>
<script>
let data=null,tab='live',sel=null,mode=null,projects=[],projectRequest=0;
const $=s=>document.querySelector(s);const narrow=()=>matchMedia('(max-width:800px)').matches;
function back(){document.body.classList.remove('note');scrollTo(0,0)}
function page(nav){if(nav&&narrow()){document.body.classList.add('note');scrollTo(0,0)}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){ // small markdown renderer: headings, lists, code, bold/italic, links
  const out=[];let inCode=false,inList=false,para=[];
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank">$2</a>');
  const flush=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}if(inList){out.push('</ul>');inList=false}};
  for(const raw of src.split('\n')){
    if(raw.startsWith('```')){flush();inCode=!inCode;out.push(inCode?'<pre>':'</pre>');continue}
    if(inCode){out.push(esc(raw));continue}
    const h=raw.match(/^(#{1,4})\s+(.*)/);if(h){flush();out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);continue}
    const li=raw.match(/^\s*[-*]\s+(.*)/);if(li){if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}if(!inList){out.push('<ul>');inList=true}out.push('<li>'+inline(li[1].replace(/<!--.*?-->/g,''))+'</li>');continue}
    if(raw.trim()===''){flush();continue}
    if(inList&&/^\s{2,}/.test(raw)){out[out.length-1]=out[out.length-1].replace(/<\/li>$/,' '+inline(raw.trim())+'</li>');continue}
    para.push(raw)}
  flush();return out.join('\n')}
let repoState=null;const enc=encodeURIComponent;
function ghInfo(g){g=g||{};
  if(g.pushed&&g.unpushed)return{label:'GH ↑'+g.unpushed,cls:'warn',text:`On GitHub (${g.repo}), but ${g.unpushed} commit${g.unpushed===1?'':'s'} here ${g.unpushed===1?'is':'are'} not pushed yet`};
  if(g.pushed)return{label:'GH',cls:'ok',text:'Pushed to GitHub: '+g.repo};
  if(g.repo)return{label:'No GH',cls:'no',text:`GitHub remote is set (${g.repo}) but nothing has been pushed yet`};
  return{label:'No GH',cls:'no',text:g.git?'Git repository with no GitHub remote: not on GitHub':'Not a Git repository: not on GitHub'}}
const ghBadge=g=>{const i=ghInfo(g);return`<span class="badge gh ${i.cls}" title="${esc(i.text)}">${i.label}</span>`};
const ghUrl=u=>/^https:\/\/github\.com\//.test(u||'')?u:'#';
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
function closeRepo(){repoState=null;
  if(sel)return tab==='projects'?showProject(sel):show(sel);
  $('#view').innerHTML='<div class="empty">Pick something from the list.</div>'}
const repoBar=url=>`<div class="repohead"><button class="act" id="repoClose" type="button">← Back</button><a href="${esc(ghUrl(url))}" target="_blank" rel="noopener noreferrer">Open on GitHub ↗</a></div>`;
function crumbs(name,path){const segs=path?path.split('/'):[];
  return `<div class="crumbs"><a href="#" data-rp="">${esc(name)}</a>`+segs.map((sg,i)=>i===segs.length-1?` / <b>${esc(sg)}</b>`:` / <a href="#" data-rp="${esc(segs.slice(0,i+1).join('/'))}">${esc(sg)}</a>`).join('')+'</div>'}
const fileList=es=>es.length?`<div class="repofiles">${es.map(e=>`<a href="#" data-rp="${esc(e.path)}"><span>${e.type==='dir'?'📁':'📄'}</span><span>${esc(e.name)}${e.type==='dir'?'/':''}</span><em>${e.type==='file'?fmtSize(e.size):''}</em></a>`).join('')}</div>`:'<p class="meta">Empty.</p>';
function repoHomeHtml(name,j){const r=j.repo,note=k=>j.errors[k]?`<p class="meta">Couldn't load: ${esc(j.errors[k])}</p>`:'';
  const none=(l,t)=>l.length?'':`<p class="meta">${t}</p>`;
  return repoBar(r.url)+`<h1>${r.private?'🔒 ':''}${esc(r.name)}</h1>
  <p class="meta">${esc(r.description||'No description')} · default branch <code>${esc(r.default_branch)}</code> · last push ${esc(r.pushed_at)}${r.archived?' · archived':''}</p>
  <h2>Files</h2>${fileList(j.tree)}${note('tree')}
  <h2>${j.readme?esc(j.readme.name):'README'}</h2>${j.readme?md(j.readme.text):'<p class="meta">No README.</p>'}
  <h2>Recent commits</h2>${j.commits.length?'<ul>'+j.commits.map(c=>`<li>${esc(c.title)} <span class="meta">· ${esc(c.date)} · ${esc(c.sha)} · ${esc(c.author)}</span></li>`).join('')+'</ul>':none(j.commits,'No commits.')}${note('commits')}
  <h2>Pull requests</h2>${j.prs.length?'<ul>'+j.prs.map(x=>`<li>#${x.number} ${esc(x.title)} <span class="badge">${esc(x.state)}</span> <span class="meta">${esc(x.updated)} · ${esc(x.author)}</span></li>`).join('')+'</ul>':none(j.prs,'No pull requests.')}${note('prs')}
  <h2>Open issues</h2>${j.issues.length?'<ul>'+j.issues.map(x=>`<li>#${x.number} ${esc(x.title)} <span class="meta">${esc(x.updated)} · ${esc(x.author)} · ${x.comments} comment${x.comments===1?'':'s'}</span></li>`).join('')+'</ul>':none(j.issues,'No open issues.')}${note('issues')}`}
function repoPathHtml(name,path,j){let body;
  if(j.kind==='dir')body=fileList(j.entries);
  else if(j.too_large)body=`<p class="meta">Too large to show here (${fmtSize(j.size)}). <a href="${esc(ghUrl(j.url))}" target="_blank" rel="noopener noreferrer">Open on GitHub ↗</a></p>`;
  else if(j.binary||j.kind==='other')body=`<p class="meta">${j.binary?'Binary file':'Not a regular file ('+esc(j.type)+')'}. <a href="${esc(ghUrl(j.url))}" target="_blank" rel="noopener noreferrer">Open on GitHub ↗</a></p>`;
  else body=/\.(md|markdown)$/i.test(j.name)?md(j.text):`<pre>${esc(j.text)}</pre>`;
  return repoBar(j.url||`https://github.com/${name}`)+crumbs(name,path)+(j.kind==='file'?`<div class="meta">${esc(j.name)} · ${fmtSize(j.size)}</div>`:'')+body}
async function openRepo(name,path,nav){path=path||'';const st=repoState={name,path};page(nav);
  const v=$('#view');v.innerHTML=`<div class="empty">Loading ${esc(name)}…</div>`;v.scrollTop=0;if(!nav)scrollTo(0,0);
  const wire=()=>{$('#repoClose').onclick=closeRepo;v.querySelectorAll('[data-rp]').forEach(a=>a.onclick=e=>{e.preventDefault();openRepo(name,a.dataset.rp)})};
  try{const r=await fetch(path?`/api/repo/path?name=${enc(name)}&path=${enc(path)}`:`/api/repo?name=${enc(name)}`);const j=await r.json();
    if(repoState!==st)return;if(j.error)throw Error(j.error);
    v.innerHTML=path?repoPathHtml(name,path,j):repoHomeHtml(name,j);wire()}
  catch(e){if(repoState!==st)return;v.innerHTML=repoBar(`https://github.com/${name}`)+`<p class="stale">${esc(e.message)}</p>`;wire()}}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayOf=d=>new Date(d+'T00:00:00');
async function loadActivity(refresh){
  try{const r=await fetch('/api/activity'+(refresh?'?refresh=1':''));renderActivity(await r.json())}
  catch(e){renderActivity({error:'Could not reach the triage server.'})}
}
function renderActivity(a){const el=$('#activity');
  const retry='<button type="button" id="actRefresh">Refresh</button>';
  if(!a.weeks){el.innerHTML=`<span class="err">GitHub activity unavailable: ${esc(a.error)}</span> ${retry}`;$('#actRefresh').onclick=()=>loadActivity(true);return}
  const todayStr=new Date().toLocaleDateString('sv');let lastMonth=-1;
  const months=a.weeks.map((w,i)=>{const m=dayOf(w[0].date).getMonth();if(m===lastMonth)return'';lastMonth=m;return`<span style="grid-column:${i+1}">${MONTHS[m]}</span>`}).join('');
  const cells=a.weeks.map((w,i)=>w.map(d=>`<i class="l${d.level}${d.date===todayStr?' today':''}" style="grid-column:${i+1};grid-row:${dayOf(d.date).getDay()+1}" title="${d.count} commit${d.count===1?'':'s'} pushed on ${MONTHS[dayOf(d.date).getMonth()]} ${dayOf(d.date).getDate()}, ${dayOf(d.date).getFullYear()}"></i>`).join('')).join('');
  const repos=a.repos.map(r=>`<a href="${esc(r.url)}" data-repo="${esc(r.name)}" target="_blank" rel="noopener noreferrer" title="${esc(r.name)} · ${r.count} commit${r.count===1?'':'s'} in the last ${a.repo_days} days${r.private?' · private':''}">${r.private?'🔒 ':''}${esc(r.name.split('/').pop())} <em>${r.count}</em></a>`).join('');
  el.innerHTML=`<div class="graph"><div class="months" style="grid-template-columns:repeat(${a.weeks.length},10px)">${months}</div><div class="cells">${cells}</div></div>
  <div class="side"><div><b>${a.total}</b> commits pushed in the last year · <b>${a.active_days}</b> active days · streak <b>${a.streak}</b>d
    <span class="legend">Less ${[0,1,2,3,4].map(n=>`<i style="background:var(--g${n})"></i>`).join('')} More</span> ${retry}
    ${a.error?`<span class="err"> · showing saved data (${esc(a.error)})</span>`:''}</div>
  <div class="repos"><span>Pushed in the last ${a.repo_days} days:</span>${repos||'<span>no commits yet</span>'}</div></div>`;
  $('#actRefresh').onclick=()=>loadActivity(true);
  el.querySelectorAll('[data-repo]').forEach(a=>a.onclick=e=>{e.preventDefault();openRepo(a.dataset.repo,'',true)});
  const g=el.querySelector('.graph');g.scrollLeft=g.scrollWidth}
async function load(keep){if(tab==='projects')return loadProjects();const requestedTab=tab;const r=await fetch('/api/notes');data=await r.json();if(tab!==requestedTab)return;
  const live=data.live;const stale=live.filter(n=>n.stale).length;
  $('#stats').innerHTML=`<b>${live.length}</b> live · <b>${live.filter(n=>n.status==='open').length}</b> open · <b>${live.filter(n=>n.status==='cooking').length}</b> cooking · <b>${data.done.length}</b> done`+(stale?` · <span class="stale">${stale} stale (&gt;60d)</span>`:'');
  renderInflight();renderList();
  if(!keep||!live.find(n=>n.file===sel)){sel=tab==='live'&&live.length?live[0].file:null}
  if(sel)show(sel);else{$('#view').innerHTML='<div class="empty">Backlog empty. Go build something.</div>';$('#decide').innerHTML='<div class="empty">Nothing to decide.</div>'}}
function renderInflight(){const el=$('#inflight');const f=data.inflight;
  if(!f.length){el.innerHTML='<span style="color:var(--mute)">In flight: nothing promoted yet. Promote a note to start the clock.</span>';return}
  el.innerHTML='<b>In flight:</b> '+f.map(x=>{const cls=x.done?'done':x.days_left<0?'late':x.days_left<=2?'soon':'';
    const when=x.done?'done':x.days_left<0?`${-x.days_left}d late`:x.days_left===0?'due today':`${x.days_left}d left`;
    return `<span class="chip ${cls}" title="${x.path}" onclick="openPath('${x.path}')">${esc(x.title)} · ${x.dest} · ${when}</span>`}).join('')}
function openPath(p){if(narrow())return;fetch('/api/open',{method:'POST',body:JSON.stringify({path:data.notes_dir+'/../'+p})})}
function renderList(){if(tab==='projects'){projectList();return}const items=tab==='live'?data.live:data.done;
  $('#list').innerHTML=items.length?items.map(n=>`<div class="row ${n.file===sel?'sel':''}" data-f="${n.file}">
    <div class="t">${esc(n.title)}</div><span style="display:flex;gap:6px;align-items:center"><span class="badge ${n.status}">${n.status}</span><button class="act row-copy" type="button" data-path="${esc(n.abs_path)}" title="Copy full path" style="padding:1px 8px;font-size:11px">Copy</button></span>
    <div class="m">${n.date} · <span class="${n.stale?'stale':''}">${n.age??'?'}d old</span> · ${n.type}${n.stale?' · STALE':''}</div></div>`).join(''):'<div class="empty">Nothing here.</div>';
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>show(r.dataset.f,true));
  document.querySelectorAll('.row-copy').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();copyPath(b.dataset.path,b)};
    b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();copyPath(b.dataset.path,b)}};
  })}
async function show(f,nav){sel=f;mode=null;repoState=null;page(nav);renderList();
  const r=await fetch('/api/note?f='+encodeURIComponent(f));const j=await r.json();
  const n=(tab==='live'?data.live:data.done).find(x=>x.file===f)||{};
  if(tab==='projects'||sel!==f)return;
  $('#view').innerHTML=`<div class="meta"><span class="copy-path" id="detailPath" tabindex="0" role="button" title="Click to copy full path" data-path="${esc(n.abs_path||'')}">${esc(n.abs_path||f)}</span></div>`+md(j.text||j.error||'');
  $('#view').scrollTop=0;renderDecide(n);
  const pathEl=$('#detailPath');
  if(pathEl&&n.abs_path){const go=()=>copyPath(pathEl.dataset.path,pathEl);pathEl.onclick=go;pathEl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();go()}}}}
function renderDecide(n){const d=$('#decide');
  if(tab!=='live'){d.innerHTML=`<div class="empty">Archived capture — read only.</div>`;return}
  const slug=n.file.replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'');
  d.innerHTML=`<div><b>${esc(n.title)}</b> <span class="badge ${n.status}">${n.status}</span> <span style="color:var(--mute)">${n.age}d old</span></div>
  <div class="btns">
    <button class="act" data-m="promote">Promote → build it</button>
    <button class="act" data-m="durable">Durable → reference only</button>
    <button class="act" data-m="archive">Archive → no longer useful</button>
    <button class="act" data-m="keep">Keep cooking</button>
  </div>
  <div class="form" id="form" style="display:none"></div>`;
  document.querySelectorAll('#decide .act').forEach(b=>b.onclick=()=>setMode(b.dataset.m,slug))}
function setMode(m,slug){mode=m;document.querySelectorAll('#decide .act').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const f=$('#form');f.style.display='grid';const F={
  promote:`<label>Destination</label><select id="dest"><option value="active">active — real project, ship it</option><option value="experiments">experiments — spike / prototype</option><option value="learning">learning — study material</option><option value="templates">templates — reusable scaffold</option></select>
    <label>Folder / file name</label><input id="slug" value="${slug}">
    <label>Due in (days)</label><input id="due" type="number" value="7" min="1" max="30" style="width:90px">
    <label>Definition of done</label><input id="note" placeholder="What does shipped look like? One sentence." autofocus>
    <div class="go"><button onclick="apply()">Promote</button><span class="kbd">copies note to ../&lt;dest&gt;, stamps due date, moves capture to done/</span></div>`,
  durable:`<label>File name</label><input id="slug" value="${slug}">
    <label>Why keep it</label><input id="note" placeholder="optional: what this is a reference for" autofocus>
    <div class="go"><button onclick="apply()">Save to reference/</button><span class="kbd">reference notes live in ../reference (Obsidian: Reference/)</span></div>`,
  archive:`<label>Why not</label><input id="note" placeholder="one line: why this died" autofocus>
    <div class="go"><button class="danger" onclick="apply()">Archive</button><span class="kbd">status: dead, moved to done/</span></div>`,
  keep:`<label>Status</label><select id="status"><option value="cooking">cooking — I'm working it</option><option value="open">open — still just a question</option></select>
    <label>Next step</label><input id="note" placeholder="optional: the one thing to do next" autofocus>
    <div class="go"><button onclick="apply()">Keep</button><span class="kbd">leaves it in the backlog</span></div>`}[m];
  f.innerHTML=F;const i=f.querySelector('input[autofocus]');if(i)i.focus()}
async function apply(){if(!mode||!sel)return;const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};
  const body={file:sel,action:mode,note:g('note'),dest:g('dest'),slug:g('slug'),due_days:g('due'),status:g('status')};
  const r=await fetch('/api/action',{method:'POST',body:JSON.stringify(body)});const j=await r.json();
  const go=$('.go');if(!go)return;let t=go.querySelector('.toast');if(!t){t=document.createElement('span');t.className='toast';go.appendChild(t)}
  if(j.error){t.className='toast err';t.textContent=j.error;return}
  t.textContent=j.msg;
  const idx=data.live.findIndex(n=>n.file===sel);const next=data.live[idx+1]||data.live[idx-1];
  if(mode==='keep'){await load(true)}else{sel=next?next.file:null;await load(true)}}
function projectList(){
  $('#list').innerHTML=projects.length?projects.map((p,i)=>`<div class="row ${sel===p.name?'sel':''}" data-project="${i}" role="button" tabindex="0"><div class="t">${ghBadge(p.gh)}${esc(p.name)}</div><span style="display:flex;gap:6px;align-items:center">${p.done_defined?'':'<span class="badge nodone" title="No definition of done yet">No done defined</span>'}<span class="badge">${p.repo?'Git':'Folder'}</span><button class="act row-copy" type="button" data-path="${esc(p.abs_path)}" title="Copy full path" style="padding:1px 8px;font-size:11px">Copy</button></span><div class="m">${esc(p.path)}</div></div>`).join(''):'<div class="empty">No active projects yet. Promote a note to active to start one.</div>';
  document.querySelectorAll('[data-project]').forEach(el=>{el.onclick=()=>showProject(projects[Number(el.dataset.project)].name,true);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});
  document.querySelectorAll('.row-copy').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();copyPath(b.dataset.path,b)};
    b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();copyPath(b.dataset.path,b)}};
  });
}
function renderDodCount(){const missing=projects.filter(p=>!p.done_defined).length,el=$('#dodCount');if(!el)return;
  el.innerHTML=missing?`<span class="stale">${missing} of ${projects.length} have no definition of done</span>`:`<span style="color:var(--ok)">All ${projects.length} have a definition of done</span>`}
const oneLine=t=>t.replace(/\s+/g,' ').trim();
function renderDod(p,mode,draft){const el=$('#dod');if(!el)return;const d=p.done,file=d.source||'NOTES.md',old=d.defined?d.text:'';
  if(mode==='edit'){
    el.innerHTML=`<div class="dod ${d.defined?'':'missing'}"><div class="dodhead"><h2>Definition of done: editing</h2></div>
      <textarea id="dodText" rows="3" maxlength="600" placeholder="One or two sentences: what does shipped look like?">${esc(draft??old)}</textarea>
      <div class="dodbtns"><button class="act" id="dodReview">Review change</button><button class="act" id="dodCancel">Cancel</button><span class="err" id="dodErr"></span></div>
      <div class="meta">Saved to ${esc(file)}. Nothing is written until you confirm on the next step.</div></div>`;
    const t=$('#dodText');t.focus();t.setSelectionRange(t.value.length,t.value.length);
    $('#dodCancel').onclick=()=>renderDod(p);
    $('#dodReview').onclick=()=>{const next=oneLine(t.value);
      if(!next){$('#dodErr').textContent='Write what done looks like first.';return}
      if(next===old){$('#dodErr').textContent='No change to save.';return}
      renderDod(p,'confirm',next)};return}
  if(mode==='confirm'){
    el.innerHTML=`<div class="dod confirm"><div class="dodhead"><h2>Confirm change to ${esc(file)}</h2></div>
      <div class="dodcmp"><div><b>BEFORE</b><p class="old">${old?esc(old):'(not set)'}</p></div><div><b>AFTER</b><p>${esc(draft)}</p></div></div>
      <div class="dodbtns"><button class="act go" id="dodSave">Confirm and save</button><button class="act" id="dodBack">Back to editing</button><span class="err" id="dodErr"></span></div></div>`;
    $('#dodBack').onclick=()=>renderDod(p,'edit',draft);
    $('#dodSave').onclick=async()=>{const b=$('#dodSave');b.disabled=true;b.textContent='Saving…';
      try{const r=await fetch('/api/done',{method:'POST',body:JSON.stringify({name:p.name,text:draft,expected:old})});const j=await r.json();
        if(j.error){$('#dodErr').textContent=j.error;b.disabled=false;b.textContent='Confirm and save';return}
        const pr=await fetch('/api/projects');projects=(await pr.json()).projects;projectList();renderDodCount();showProject(p.name)}
      catch(e){$('#dodErr').textContent='Could not reach the triage server.';b.disabled=false;b.textContent='Confirm and save'}};return}
  el.innerHTML=d.defined?`<div class="dod"><div class="dodhead"><h2>Definition of done</h2><button class="act" id="dodEdit">Edit</button></div><p>${esc(d.text)}</p><div class="meta">From ${esc(d.source)}</div></div>`
    :`<div class="dod missing"><div class="dodhead"><h2>Definition of done: not filled in</h2><button class="act" id="dodEdit">Fill in</button></div><p>What does done look like for this project? It will be saved to <code>${esc(file)}</code>.</p></div>`;
  $('#dodEdit').onclick=()=>renderDod(p,'edit')}
async function loadProjects(){
  mode=null;$('#hint').textContent='Active projects · j/k next/prev · y copy path · select a project for details';
  $('#decide').innerHTML='<b>Active Projects</b> <button class="act" id="refreshProjects">Refresh</button> <span id="dodCount"></span>';
  $('#refreshProjects').onclick=loadProjects;
  $('#list').innerHTML='<div class="empty">Loading projects…</div>';
  try{const r=await fetch('/api/projects');if(!r.ok)throw Error('Could not load active projects.');const j=await r.json();if(tab!=='projects')return;
    projects=j.projects;projectList();
    renderDodCount();
    if(projects.length)await showProject(projects.some(p=>p.name===sel)?sel:projects[0].name);
    else $('#view').innerHTML='<div class="empty">Your active project folders will appear here.</div>';
  }catch(e){if(tab==='projects'){$('#list').innerHTML='<div class="empty">Projects unavailable.</div>';$('#view').textContent=e.message}}
}
async function showProject(name,nav){
  sel=name;mode=null;repoState=null;page(nav);projectList();const request=++projectRequest;
  $('#view').innerHTML='<div class="empty">Loading repository activity…</div>';
  try{const r=await fetch('/api/project?name='+encodeURIComponent(name));if(!r.ok)throw Error('Could not load this project.');const p=await r.json();
    if(tab!=='projects'||request!==projectRequest)return;
    const link=(url,label)=>/^https:\/\/github\.com\//.test(url||'')?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:esc(label);
    const commits=items=>items.map(c=>`<li>${esc(c.title)} <span class="meta">· ${esc(c.date)} · ${esc(c.sha)}</span></li>`).join('');
    $('#view').innerHTML=`<div class="meta"><span class="copy-path" id="detailPath" tabindex="0" role="button" title="Click to copy full path" data-path="${esc(p.abs_path)}">${esc(p.abs_path)}</span>${p.branch?' · '+esc(p.branch):''}</div><h1>${esc(p.name)}</h1>
      ${p.repo?`<p><button class="act" id="repoOpen" type="button">Review repository</button> ${link(p.remote,'Open on GitHub ↗')}</p>`:''}
      <p class="meta">${ghBadge(p.gh)} ${esc(ghInfo(p.gh).text)}</p>
      <div id="dod"></div>
      <h2>Repository summary</h2><p style="white-space:pre-wrap">${esc(p.summary)}</p>${p.summary_source?`<div class="meta">Excerpt from ${esc(p.summary_source)}</div>`:''}
      <h2>Recent pull requests</h2>${p.pr_status?`<p class="meta">${esc(p.pr_status)}</p>`:`<ul>${p.prs.map(pr=>`<li>${link(pr.url,'#'+pr.number+' '+pr.title)} <span class="badge">${esc(pr.mergedAt?'MERGED':pr.state)}</span> <span class="meta">${esc(pr.updatedAt.slice(0,10))}</span></li>`).join('')}</ul>`}
      <h2>Features added</h2><p class="meta">Feature commits on the current branch, from the latest 100 commits.</p>${p.features.length?'<ul>'+commits(p.features)+'</ul>':'<p class="meta">No commits labeled feat: or feat(scope): found.</p>'}
      <h2>Recent commits</h2>${p.commits.length?'<ul>'+commits(p.commits)+'</ul>':'<p class="meta">No Git history available.</p>'}`;
    $('#view').scrollTop=0;renderDod(p);if(p.repo)$('#repoOpen').onclick=()=>openRepo(p.repo,'',true);
    const pathEl=$('#detailPath');
    if(pathEl){const go=()=>copyPath(pathEl.dataset.path,pathEl);pathEl.onclick=go;pathEl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}}
  }catch(e){if(tab==='projects'&&request===projectRequest)$('#view').textContent=e.message}
}
async function copyPath(path,el){
  try{await navigator.clipboard.writeText(path)}catch(e){return}
  if(!el)return;
  if(el.dataset.orig===undefined)el.dataset.orig=el.textContent;
  clearTimeout(el._copyTimer);el.textContent='Copied';
  el._copyTimer=setTimeout(()=>{el.textContent=el.dataset.orig},1000);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;mode=null;repoState=null;back();$('#hint').textContent='Keys: j/k next/prev · p promote · d durable · a archive · c keep · y copy path · Enter apply';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));sel=null;load()});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')){if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();apply()}return}
  if(tab==='projects'){const i=projects.findIndex(p=>p.name===sel);if(e.key==='j'&&projects[i+1])showProject(projects[i+1].name);if(e.key==='k'&&projects[i-1])showProject(projects[i-1].name);
    if(e.key==='y'&&i>=0){const pathEl=$('#detailPath');if(pathEl)copyPath(projects[i].abs_path,pathEl)}return}
  if(!data)return;
  const items=tab==='live'?data.live:data.done;const i=items.findIndex(n=>n.file===sel);
  if(e.key==='j'&&items[i+1])show(items[i+1].file);else if(e.key==='k'&&items[i-1])show(items[i-1].file);
  else if(e.key==='y'){const pathEl=$('#detailPath');if(i>=0&&pathEl&&items[i].abs_path)copyPath(items[i].abs_path,pathEl)}
  else if(tab==='live'&&sel){const slug=sel.replace(/^\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'');
    if(e.key==='p')setMode('promote',slug);else if(e.key==='d')setMode('durable',slug);else if(e.key==='a')setMode('archive',slug);else if(e.key==='c')setMode('keep',slug);else if(e.key==='Enter')apply()}});
load();loadActivity();setInterval(()=>loadActivity(),600000);
</script></body></html>
