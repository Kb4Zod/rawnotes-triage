<style>
@font-face{font-family:'Cormorant Garamond';src:url(/static/fonts/CormorantGaramond.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url(/static/fonts/CormorantGaramond-italic.woff2) format('woff2');font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:Lato;src:url(/static/fonts/Lato-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Lato;src:url(/static/fonts/Lato-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Lato;src:url(/static/fonts/Lato-900.woff2) format('woff2');font-weight:900;font-display:swap}

:root{
  --bg:#f4f7f4;--glow1:rgba(203,168,90,.14);--glow2:rgba(43,122,84,.11);
  --surface:rgba(255,255,255,.80);--solid:#fff;--sunk:#edf2ee;
  --ink:#1f2924;--ink2:#3d4d45;--mute:#58695f;--line:rgba(43,122,84,.14);--line2:rgba(43,122,84,.30);
  --green:#2b7a54;--green-ink:#1e593d;--green-soft:rgba(43,122,84,.10);
  --gold:#cba85a;--gold-ink:#7f611a;--gold-soft:rgba(203,168,90,.18);
  --teal:#2f6f7e;--teal-ink:#245764;--teal-soft:rgba(47,111,126,.10);
  --rust:#b4533a;--rust-ink:#963f29;--rust-soft:rgba(180,83,58,.10);
  --g0:#e4ece6;--g1:#b9dcc6;--g2:#7fbf98;--g3:#3f9a6a;--g4:#1f6b47;
  --s1:#1f8467;--s2:#b5702a;--on-accent:#fff;--on-rust:#fff;--toast-bg:#1f2924;--toast-fg:#f4f7f4;--toast-acc:#e3c886;--toast-bad:#9c4530;
  --shadow:0 1px 2px rgba(31,41,36,.04),0 10px 30px rgba(31,41,36,.05);--shadow-lift:0 18px 40px rgba(43,122,84,.14);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:Lato,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
.dark{
  --bg:#0f1512;--glow1:rgba(217,185,106,.07);--glow2:rgba(95,191,141,.07);
  --surface:rgba(25,34,29,.82);--solid:#18201c;--sunk:#131a16;
  --ink:#e6ede8;--ink2:#c3d0c8;--mute:#8fa398;--line:rgba(143,216,176,.11);--line2:rgba(143,216,176,.26);
  --green:#5fbf8d;--green-ink:#8fd8b0;--green-soft:rgba(95,191,141,.12);
  --gold:#d9b96a;--gold-ink:#e3c886;--gold-soft:rgba(217,185,106,.13);
  --teal:#6fb3c4;--teal-ink:#97cbd8;--teal-soft:rgba(111,179,196,.12);
  --rust:#e07a5f;--rust-ink:#eb9a84;--rust-soft:rgba(224,122,95,.12);
  --g0:#1c2621;--g1:#1d4a33;--g2:#24704a;--g3:#35a06a;--g4:#6fd39c;
  --s1:#2b9c78;--s2:#c07f2c;--on-accent:#0f1512;--on-rust:#0f1512;--toast-bg:#e6ede8;--toast-fg:#0f1512;--toast-acc:#6b4f10;--toast-bad:#9c4530;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);--shadow-lift:0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
.rh1{display:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;left:8px;top:-60px;z-index:200;padding:8px 14px;border-radius:8px;background:var(--solid);color:var(--ink);border:2px solid var(--green);font-weight:700;text-decoration:none}
.skip:focus{top:8px}
main:focus,#main h1:focus,h1:focus{outline:none}
html,body{height:100%;margin:0}
body{color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body,.reader:has(>.decide:not(.open)):before{background:var(--bg);
  background-image:radial-gradient(circle at 92% 0%,var(--glow1),transparent 45%),radial-gradient(circle at 0% 100%,var(--glow2),transparent 50%);background-attachment:fixed}
h1,h2,h3,h4,.serif,.num{font-family:var(--serif);font-weight:600;letter-spacing:.2px;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
#main{min-width:0;min-height:0;height:100vh;overflow:hidden}
/* rail */
.rail{display:flex;flex-direction:column;padding:22px 14px 16px;border-right:1px solid var(--line);background:var(--surface);backdrop-filter:blur(12px);min-height:0;overflow:auto}
.brand{padding:0 10px 18px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.brand .name{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.brand .name em{font-style:italic;color:var(--green)}
.brand .sub{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-ink);margin-top:6px;display:flex;align-items:center;gap:8px}
.brand .sub:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:700;font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--sunk)}
.nav a svg{width:18px;height:18px;opacity:.8}
.nav a .n{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700}
.nav a .n.alert{color:var(--on-rust);background:var(--rust);border-radius:10px;padding:0 7px}
.nav a.on{background:var(--green-soft);color:var(--green-ink);box-shadow:inset 3px 0 var(--green)}
.label{font:900 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.rail .label{padding:16px 10px 6px}
.lifecycle{margin:2px 10px 0;font-size:12px;color:var(--mute);display:grid;gap:4px}
.rail .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.rail .foot b{color:var(--ink)}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px;margin:6px 0 8px}
.spark i{flex:1;background:var(--g3);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.foot .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px}
.linkish{background:none;border:0;padding:0;color:var(--mute);cursor:pointer;font-size:12px}
.linkish:hover{color:var(--ink)}
kbd{font:500 11px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:var(--solid);color:var(--ink2);white-space:nowrap}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* shared */
.pane-h{padding:22px 22px 12px}
.pane-h h1{font-size:34px;margin:0;line-height:1.05}
.pane-h .sub{color:var(--mute);font-size:13px;margin-top:4px}
.search{display:flex;align-items:center;gap:8px;margin-top:14px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--solid);color:var(--mute)}
.search input{flex:1;border:0;background:transparent;padding:9px 0;outline:none;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.chips{display:flex;margin-top:12px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--sunk)}
.chips.sm{margin-top:6px}.chips.sm .chip{padding:5px 6px;font-size:12px}
.chip{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border:0;border-right:1px solid var(--line);background:none;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip:last-child{border-right:0}.chip:hover{background:var(--solid)}
.chip b{font-weight:900;color:var(--mute)}
.chip.on{background:var(--green);color:var(--on-accent)}.chip.on b{color:inherit}
.chip.warn b{color:var(--rust)}.chip.warn.on{background:var(--rust)}.chip.warn.on b{color:inherit}
.chips.stack .chip{flex:1 1 auto;min-width:auto;flex-direction:column;gap:0;padding:5px 4px;line-height:1.25}
.shipby{display:flex;gap:8px;align-items:stretch}.shipby .seg{flex:1}.shipby input[type=date]{width:auto;flex:none;padding:6px 8px}
.shipby input[type=date].on{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.flag{margin:0 0 14px;padding:10px 14px;border-radius:10px;border:1px solid var(--rust);color:var(--ink2);font-size:13px;background:var(--solid)}
#vbanner{position:sticky;top:0;z-index:50;padding:9px 16px;background:var(--gold);color:#1c1a12;font-weight:700;font-size:13px;text-align:center}
#vbanner button{margin-left:10px;font:inherit;text-decoration:underline;background:none;border:0;color:inherit;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.st.open,.st.cooking,.st.soon{color:var(--gold-ink);background:var(--gold-soft)}
.st.open .dot{border:2px solid var(--gold);width:9px;height:9px}.st.cooking .dot,.st.soon .dot{background:var(--gold)}
.st.promoted,.st.ok,.st.shipped{color:var(--green-ink);background:var(--green-soft)}.st.promoted .dot,.st.ok .dot,.st.shipped .dot{background:var(--green)}
.st.reference,.st.merged,.st.exp{color:var(--teal-ink);background:var(--teal-soft)}.st.reference .dot,.st.merged .dot,.st.exp .dot{background:var(--teal)}
.st.dead,.st.killed,.st.late{color:var(--rust-ink);background:var(--rust-soft)}.st.dead .dot,.st.killed .dot,.st.late .dot{background:var(--rust)}
.st.plain{color:var(--ink2);background:var(--sunk);padding-left:9px}.st.plain .dot{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 15px;border-radius:9px;border:1px solid var(--line2);background:var(--solid);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.danger{background:var(--rust);border-color:var(--rust);color:var(--on-rust)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:wait}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--mute)}
.err{color:var(--rust-ink);font-weight:700;font-size:13px}
.empty{color:var(--mute);padding:48px 20px;text-align:center;font-family:var(--serif);font-size:20px}
.copy{cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--mute);word-break:break-all}
.copy:hover{color:var(--ink)}
/* split view: Inbox and Archive */
.split{display:grid;grid-template-columns:400px 1fr;height:100vh;min-height:0}
.listpane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.list{position:relative;overflow:auto;flex:1;padding:4px 10px 24px}
.grp-h{font:900 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding:14px 12px 6px;display:flex;justify-content:space-between}
.grp-h h2{font:inherit;letter-spacing:inherit;text-transform:inherit;margin:0}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:10px 12px 10px 0;border-radius:11px;cursor:pointer;margin-bottom:2px;align-items:center;border:1px solid transparent}
.item .bar{align-self:stretch;border-radius:3px;background:var(--line2)}
.item .bar.h1{background:var(--gold)}.item .bar.h2{background:var(--rust)}
.item .t{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item .age{font-weight:700;font-size:12px;color:var(--mute);text-align:right}
.item .age.a1{color:var(--gold-ink)}.item .age.a2{color:var(--rust)}
.item:hover{background:var(--sunk)}
.item.sel{background:var(--solid);box-shadow:var(--shadow);border-color:var(--line2)}
.item.stack{background:var(--solid);border:1px dashed var(--line2);padding:12px 12px 12px 0;margin:6px 0 10px;position:relative}
.item.stack.sel{border:1px solid var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.item.stack .t{font-family:var(--serif);font-size:19px;font-weight:700}
.item.stack .count{font:900 12px var(--sans);background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 9px}
.item.member{grid-template-columns:4px 22px 1fr auto;margin-left:14px}
.cb{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border-radius:5px;border:1.5px solid var(--mute);display:inline-grid;place-items:center;background:var(--solid);cursor:pointer;padding:0;position:relative}
.cb:checked{background:var(--green);border-color:var(--green)}
.cb:checked:after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cb:before{content:"";position:absolute;inset:-9px}
.rowmain{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;color:inherit;min-width:0;font:inherit}
.rowmain .t{font-size:14px}
.reader{overflow:auto;min-height:0;padding:20px 32px 60px}
.back{display:none}
/* decide */
.decide{position:sticky;top:0;z-index:5;padding:14px;margin:-6px -6px 22px}
.decide.open{position:relative}
/* blanks the reader's 20px top padding above the pinned panel, so the note scrolls out of sight there (page background).
   It pins one layer below the panel and runs 5px under its top edge: butted against the edge, a fractional scroll or a
   browser zoom left a hairline row of text between the two. */
.reader:has(>.decide:not(.open)):before{content:"";display:block;position:sticky;top:-20px;z-index:4;height:25px;margin:0 -32px -25px;pointer-events:none}
.decide .q{display:flex;align-items:baseline;gap:10px;margin:0 4px 12px;flex-wrap:wrap}
.decide .q h2{margin:0;font-size:21px}
.decide .q .muted{font-size:13px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opt{position:relative;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--solid);cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .15s;text-align:left}
.opt:hover{border-color:var(--line2)}
.opt .k{position:absolute;top:6px;right:6px}.opt .k kbd{font-size:10px;padding:0 4px}
.opt .v{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
.opt .v i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.opt .d{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.4}
.opt.promote .v i{background:var(--green-soft);color:var(--green)}
.opt.reference .v i{background:var(--teal-soft);color:var(--teal)}
.opt.keep .v i{background:var(--gold-soft);color:var(--gold-ink)}
.opt.kill .v i{background:var(--rust-soft);color:var(--rust)}
.opt.on.promote{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.opt.on.reference{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.opt.on.keep{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.opt.on.kill{border-color:var(--rust);box-shadow:0 0 0 3px var(--rust-soft)}
.opt.dim{background:var(--sunk)}.opt.dim .v i{filter:grayscale(.7)}
.form{margin-top:14px;padding:18px 18px 16px;border-radius:12px;background:var(--solid);border:1px solid var(--line2);display:grid;grid-template-columns:1fr 300px;gap:22px}
.form.promote{border-color:var(--green)}.form.reference{border-color:var(--teal)}.form.keep{border-color:var(--gold)}.form.kill{border-color:var(--rust)}
.field{margin-bottom:14px}
.field>label,.field>.label{display:block;margin-bottom:6px}
.field label em{font-style:normal;color:var(--rust);letter-spacing:0;text-transform:none;font-weight:700;margin-left:6px}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;text-align:center;padding:8px 6px;font-weight:700;font-size:13px;color:var(--ink2);border:0;border-right:1px solid var(--line);background:none;cursor:pointer;line-height:1.3}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.seg button.on{background:var(--green);color:var(--on-accent)}.seg button.on small{color:inherit}
.input{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);font-size:14px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
textarea.input{min-height:72px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.preview{background:var(--sunk);border-radius:10px;padding:14px;font-size:13px;align-self:start}
.preview .label{margin-bottom:10px}
.preview ol{margin:0;padding-left:18px}.preview li{margin-bottom:8px}
.preview .mono{word-break:break-all;color:var(--green-ink)}
.formfoot{grid-column:1/-1;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.formfoot .hint{margin-left:auto;font-size:12.5px;color:var(--mute)}
/* doc */
.doc{max-width:860px;padding:30px 40px 36px}
.doc .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc .title{font-size:44px;line-height:1.05;margin:16px 0 10px;overflow-wrap:anywhere}
h1.title{font-size:38px;line-height:1.05;margin:16px 0 10px;overflow-wrap:anywhere}
.doc .path{margin-bottom:18px}
.ask{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 18px;border-radius:0 10px 10px 0;margin-bottom:10px}
.ask .label{color:var(--gold-ink);margin-bottom:4px}
.ask h3.label{margin:0 0 4px}
.ask .md p,.ask .md li{margin:0 0 .6em;font-family:var(--serif);font-size:20px;line-height:1.4;font-weight:500;color:var(--ink)}
.ask .md>:last-child{margin-bottom:0}.ask .md h4,.ask .md h5,.ask .md h6{font-size:17px;margin:12px 0 4px}.ask .md ul{margin:0 0 .6em}.ask .md pre{font-size:12.5px}
.outcome{border-left:3px solid var(--teal);background:var(--teal-soft);padding:12px 18px;border-radius:0 10px 10px 0;margin-bottom:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.md{overflow-wrap:anywhere}
.md h1{font-size:30px}.md h2{font-size:26px;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.md h3{font-size:20px;margin:20px 0 6px}.md h4{font-size:17px;margin:16px 0 4px}
.doc>.md>h3{font-size:26px;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}.doc>.md>h4{font-size:20px;margin:20px 0 6px}.doc>.md>h5{font-size:17px;margin:16px 0 4px}
.md p,.md li{color:var(--ink2);font-size:15px;line-height:1.7}
.md ul{padding-left:20px}
.md code{font:12.5px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:5px}
.md .tbl{overflow-x:auto;margin:10px 0}.md table{border-collapse:collapse;font-size:13.5px}.md td{border:1px solid var(--line2);padding:5px 9px;vertical-align:top;color:var(--ink2)}.md tr:first-child td{font-weight:700;background:var(--sunk)}

  let j;try{j=await r.json()}catch(e){if(e.name==='AbortError')throw e;throw Error('The triage server sent something unexpected.')}

   reply can never paint over another screen or hit an element that is gone. */

/* ---------- Inbox model ---------- */
const DECIDED=['promoted','dead','killed','merged','shipped','done','reference'];
const stuck=n=>DECIDED.includes((n.status||'').toLowerCase());  // e.g. status: promoted but still in RawNotes/
function passes(n){const f=S.f;
  if(f.status==='stuck'&&!stuck(n))return false;
  if(f.status==='open'&&n.status!=='open')return false;
  if(f.status==='cooking'&&n.status!=='cooking')return false;
  if(f.status==='stale'&&!n.stale)return false;
  if(f.type&&n.type!==f.type)return false;
  if(f.q){const q=f.q.toLowerCase();if(!(n.title+' '+n.question+' '+n.file).toLowerCase().includes(q))return false}
  return true}
const stackKey=n=>slugOf(n.file).split('-').slice(0,2).join('-');
function stackName(ms){const words=ms.map(n=>n.title.split(/\s+/));let k=0;
  while(words.every(w=>w[k]!==undefined&&w[k].toLowerCase().replace(/[:—–-]+$/,'')===words[0][k].toLowerCase().replace(/[:—–-]+$/,'')))k++;
  const s=words[0].slice(0,k).join(' ').replace(/[\s:—–-]+$/,'');
  return s.length>2?s:slugOf(ms[0].file).split('-').slice(0,2).join(' ').replace(/^./,c=>c.toUpperCase())}
function inboxModel(){
  const live=S.notes.live.filter(passes);const by={};
  if(!S.f.q)live.forEach(n=>{(by[stackKey(n)]=by[stackKey(n)]||[]).push(n)});
  const stacks={};for(const k in by)if(by[k].length>=3)stacks[k]={key:k,members:by[k],name:stackName(by[k])};
  const older=[],recent=[],seen=new Set();
  for(const n of live){const k=stackKey(n),s=stacks[k];
    if(s){if(seen.has(k))continue;seen.add(k);const newest=Math.min(...s.members.map(m=>m.age??0));(newest>=14?older:recent).push({kind:'stack',...s});continue}
    ((n.age??0)>=14?older:recent).push({kind:'note',n})}
  return{older,recent,stacks,count:live.length}}
function navOrder(m){const out=[];for(const e of[...m.older,...m.recent]){if(e.kind==='note')out.push(e.n.file);else{out.push('stack:'+e.key);if(S.expanded===e.key)e.members.forEach(n=>out.push(n.file))}}return out}

/* ---------- Inbox view ---------- */
function renderInbox(){
  const m=inboxModel(),live=S.notes.live;
  const ord=navOrder(m);

  if(S.sel&&S.sel.startsWith('stack:'))S.expanded=S.sel.slice(6);
  const cnt=s=>live.filter(n=>s==='stale'?n.stale:s==='stuck'?stuck(n):n.status===s).length,nstuck=cnt('stuck');
  if(S.f.status==='stuck'&&!nstuck)S.f.status='all';
  const chip=(v,label,n,cls='')=>`<button class="chip ${cls} ${S.f.status===v?'on':''}" data-st="${v}" aria-pressed="${S.f.status===v}">${label} <b>${n}</b></button>`;
  const tchip=v=>`<button class="chip ${(S.f.type||'')===v?'on':''}" data-ty="${v}" aria-pressed="${(S.f.type||'')===v}">${v?v[0].toUpperCase()+v.slice(1):'Any type'}</button>`;
  $('#main').innerHTML=`<div class="split"><div class="listpane"><div class="pane-h"><h1>Inbox</h1>
    <div class="sub">${live.length} note${live.length===1?'':'s'} waiting on a decision · oldest first</div>
    <div class="search">${I.search}<input id="q" type="search" aria-label="Search notes" placeholder="Search notes…" value="${esc(S.f.q)}" autocomplete="off" aria-keyshortcuts="/">${kbh('/')}</div>
    <div class="chips" role="group" aria-label="Status">${chip('all','All',live.length)}${chip('open','Open',cnt('open'))}${chip('cooking','Cooking',cnt('cooking'))}${chip('stale','Stale',cnt('stale'))}${nstuck?chip('stuck','Stuck',nstuck,'warn'):''}</div>
    <div class="chips sm" role="group" aria-label="Type">${tchip('')}${tchip('question')}${tchip('research')}${tchip('issue')}</div></div>
    <div class="list" id="list"></div></div><div class="reader" id="reader"></div></div>`;
  $('#q').oninput=e=>{S.f.q=e.target.value;renderInboxList(true)};
  $$('[data-st]').forEach(b=>b.onclick=()=>{S.f.status=b.dataset.st;renderInbox()});
  $$('[data-ty]').forEach(b=>b.onclick=()=>{S.f.type=b.dataset.ty||null;renderInbox()});
  renderInboxList();renderReader()}
function renderInboxList(fromSearch){
  const m=inboxModel(),el=$('#list');if(!el)return;
  const row=n=>{const a=n.age??0,c=ageCls(a);return `<div class="item ${n.file===S.sel?'sel':''}" data-f="${esc(n.file)}" role="button" tabindex="0"${n.file===S.sel?' aria-current="true"':''}>
    <span class="bar ${c?'h'+c:''}"></span><div><div class="t">${esc(n.title)}</div><div class="m">${st(n.status)}<span>${esc(n.type)}</span>${n.stale?'<span class="err">stale</span>':''}${stuck(n)?'<span class="err" title="Its status says it was decided, but it is still in the Inbox">not moved</span>':''}</div></div><span class="age ${c?'a'+c:''}" title="waiting ${a} days"><span class="sr">waiting </span>${a}d</span></div>`};
  // A stack member is a row with TWO real controls (the tick box and the open button), so the row itself is not a button.
  const member=n=>`<div class="item member ${n.file===S.sel?'sel':''}" data-f="${esc(n.file)}"><span class="bar"></span>
    <input type="checkbox" class="cb" data-cb="${esc(n.file)}" ${S.batch.has(n.file)?'checked':''} aria-label="Select ${esc(n.title)}, ${esc(n.file)}">
    <button type="button" class="rowmain" aria-current="${n.file===S.sel}"><span class="t" style="font-weight:${S.batch.has(n.file)?700:400}">${esc(n.title)}</span></button><span class="age"><span class="sr">waiting </span>${n.age}d</span></div>`;
  const ent=e=>{if(e.kind==='note')return row(e.n);const open=S.expanded===e.key,id='stack:'+e.key;
    const dates=e.members.map(n=>n.date).sort();
    return `<div class="item stack ${S.sel===id?'sel':''}" data-f="${esc(id)}" role="button" tabindex="0" aria-expanded="${open}"${S.sel===id?' aria-current="true"':''}><span class="bar"></span><div><div class="t">${esc(e.name)}</div>
      <div class="m">${e.members.length} related notes · ${dates[0]===dates.at(-1)?dates[0]:dates[0].slice(5)+' – '+dates.at(-1).slice(5)} · ${open?'decide them together':'open to decide them together'}</div></div><span class="count">${e.members.length}</span></div>`+(open?e.members.map(member).join(''):'')};
  const grp=(label,es)=>es.length?`<div class="grp-h"><h2>${label}</h2><span>${es.reduce((s,e)=>s+(e.kind==='note'?1:e.members.length),0)}</span></div>${es.map(ent).join('')}`:'';
  el.innerHTML=m.count?grp('Waiting 2+ weeks',m.older)+grp('This fortnight',m.recent):`<div class="empty">${S.notes.live.length?'Nothing matches.':'Inbox zero. Go build something.'}</div>`;
  el.querySelectorAll('[data-f]').forEach(r=>{
    r.onclick=e=>{if(e.target.closest('[data-cb]'))return;selectNote(r.dataset.f,true)};
    // Enter and Space OPEN a row, nothing more. The key is marked handled so no page-level shortcut also acts on it.
    if(r.getAttribute('role')==='button')r.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===r){e.preventDefault();
      if(e.key==='Enter'&&!e.repeat&&S.armed&&S.armed===r.dataset.f&&S.sel===r.dataset.f){apply();return}  // an action was chosen on purpose for this stack: Enter submits it
      if(!e.repeat)selectNote(r.dataset.f,true)}}});
  el.querySelectorAll('[data-cb]').forEach(b=>{b.onclick=e=>e.stopPropagation();
    b.onchange=()=>{const f=b.dataset.cb;b.checked?S.batch.add(f):S.batch.delete(f);renderInboxList();
      const nb=[...$$('#list [data-cb]')].find(x=>x.dataset.cb===f);nb&&nb.focus({preventScroll:true});
      if(S.sel&&S.sel.startsWith('stack:'))renderBatchSummary()}});
  if(fromSearch){const ord=navOrder(m);if(!ord.includes(S.sel)){S.sel=ord[0]||null;S.mode=null;renderReader()}}
  const s=el.querySelector('.sel');if(s&&!fromSearch)s.scrollIntoView({block:'nearest'})}
function selectNote(f,nav){
  const inList=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#list');
  S.armed=null;
  if(f.startsWith('stack:')){const k=f.slice(6);if(S.expanded!==k){S.expanded=k;const st=inboxModel().stacks[k];S.batch=new Set(st?st.members.map(n=>n.file):[]);S.batchMode='merge'}}

function optCards(on){const o=(id,ic,v,d,k)=>`<button type="button" class="opt ${id} ${on===id?'on':on?'dim':''}" data-m="${id}" aria-pressed="${on===id}" aria-keyshortcuts="${k}"><span class="k">${kbh(k)}</span><div class="v"><i>${I[ic]}</i>${v}</div><div class="d">${d}</div></button>`;

function projectCards(){

  const used=new Set(cards.filter(c=>c.p).map(c=>c.p.path));

// "Done means" editor: edit -> review before/after -> confirm (writes only on confirm; refused if the file changed).

function renderDod(p,mode,draft){const el=$('#dodbox');if(!el)return;const d=p.done,file=d.source||'NOTES.md',old=d.defined?d.text:'',key=p.path;
  const keep=(m,t)=>{if(m)S.dods[key]={mode:m,text:t,orig:old};else delete S.dods[key]};
  if(mode==='edit'){keep('edit',draft??old);
    el.innerHTML=`<h3 class="sec label"><label for="dodText">Done means · editing</label></h3><textarea class="input" id="dodText" rows="3" maxlength="600" placeholder="One or two sentences: what does shipped look like?">${esc(S.dods[key].text)}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap"><button class="btn sm primary" id="dodReview">Review change</button><button class="btn sm ghost" id="dodCancel">Cancel</button><span class="err" id="dodErr" role="alert"></span></div>

    t.oninput=()=>keep('edit',t.value);$('#dodCancel').onclick=()=>{keep(null);renderDod(p)};
    $('#dodReview').onclick=()=>{const next=t.value.replace(/\s+/g,' ').trim();if(!next)return $('#dodErr').textContent='Write what done looks like first.';if(next===old)return $('#dodErr').textContent='No change to save.';renderDod(p,'confirm',next)};return}
  if(mode==='confirm'){keep('confirm',draft);
    el.innerHTML=`<h3 class="sec label">Confirm change to ${esc(file)}</h3><div class="dod"><div class="cmp"><div><b class="label">Before</b><div class="old">${old?esc(old):'(not set)'}</div></div><div><b class="label">After</b><div>${esc(draft)}</div></div></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm primary" id="dodSave">Confirm and save</button><button class="btn sm ghost" id="dodBack">Back</button><span class="err" id="dodErr" role="alert"></span></div></div>`;

  keep(null);

function closeOverlay(quiet){const had=$('#overlay').innerHTML;$('#overlay').innerHTML='';pal=null;backdrop(false);
  const back=returnFocus;returnFocus=null;if(!quiet&&had){if(back&&back.isConnected&&back!==document.body)back.focus();else($('#main')||document.body).focus({preventScroll:true})}}
function trapTab(e){const d=$('#overlay [role=dialog]');if(!d)return;const f=[...d.querySelectorAll(FOCUSABLE)].filter(x=>x.offsetParent!==null);
  if(!f.length){e.preventDefault();d.focus();return}
  const i=f.indexOf(document.activeElement);
  if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}
function openKeys(){showOverlay(`<div class="scrim" id="scrim"><div class="card keys" style="background:var(--solid)" role="dialog" aria-modal="true" aria-labelledby="keysH" tabindex="-1"><h2 id="keysH">Keyboard</h2><table>
  <caption class="sr">Keyboard shortcuts</caption>${[['J / K or ↓ / ↑','next / previous'],['P','Promote'],['R','Reference'],['C','Keep (cooking)'],['X','Kill'],['Enter','apply the open decision (Ctrl+Enter in a text box); on a stack, only after you chose an action with P R C X or a click'],['Esc','close the form / overlay (what you typed is kept)'],['Z','undo the last change'],['Y','copy the note’s full path'],['/','search the list'],['Ctrl K','search everything + commands'],['1 2 3 4','Inbox · Projects · Archive · Pulse'],['?','this help']].map(([k,v])=>`<tr><th scope="row" style="font-weight:400;text-align:left">${k.split(' ').map(x=>/^[A-Z↓↑]$|^[A-Za-z]{2,}$|^[\/?1-4]$/.test(x)?kb(x):x).join(' ')}</th><td>${v}</td></tr>`).join('')}</table>
  <div style="text-align:right;margin-top:14px"><button type="button" class="btn" id="keysClose">Close</button></div></div></div>`);
  $('#keysClose').onclick=()=>closeOverlay();$('#keysClose').focus()}
function openPalette(){
  showOverlay(`<div class="scrim" id="scrim"><div class="pal" role="dialog" aria-modal="true" aria-label="Search notes, projects and commands" tabindex="-1"><div class="in">${I.search}<input id="pq" role="combobox" aria-label="Search notes, projects and commands" aria-autocomplete="list" aria-expanded="true" aria-controls="pres" aria-activedescendant="" placeholder="Search notes, projects, commands…" autocomplete="off">${kbh('Esc')}</div>
   <div class="res" id="pres" role="listbox" aria-label="Results"></div><div class="sr" role="status" id="palStatus"></div>
   <div class="foot" aria-hidden="true"><span>${kb('↑')} ${kb('↓')} move</span><span>${kb('↵')} open</span><span>${kb('Esc')} close</span></div></div></div>`);
  pal={i:0,items:[]};const q=$('#pq');q.oninput=()=>{pal.i=0;palRender(q.value)};q.focus();palRender('')}
function palSelect(i){if(!pal)return;pal.i=i;let on=null;$$('#pres .r').forEach(x=>{const is=+x.dataset.pi===i;x.classList.toggle('on',is);x.setAttribute('aria-selected',is);if(is)on=x});
  const q=$('#pq');if(q)q.setAttribute('aria-activedescendant',on?on.id:'');on&&on.scrollIntoView({block:'nearest'})}
function palRender(q){q=q.trim().toLowerCase();const hit=s=>!q||s.toLowerCase().includes(q);const n=S.notes;
  const hl=s=>{const e=esc(s);if(!q)return e;const i=s.toLowerCase().indexOf(q);return i<0?e:esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))};
  const items=[];
  const notes=n.live.filter(x=>hit(x.title+' '+x.file)).slice(0,6);if(notes.length)items.push({h:'Inbox'},...notes.map(x=>({name:x.title,html:`${st(x.status)}<span class="grow">${hl(x.title)}</span><span class="muted">${x.age}d</span>`,go:()=>{location.hash='#/inbox';S.f={q:'',status:'all',type:null};S.sel=x.file;S.expanded=null;render()}})));
  const projs=projectCards().filter(c=>hit(c.title)).slice(0,4);if(projs.length)items.push({h:'Projects'},...projs.map(c=>({name:c.title,html:`${I.proj}<span class="grow">${hl(c.title)}</span><span class="muted">${c.f&&!c.f.done&&c.f.days_left!==null?(c.f.days_left<0?-c.f.days_left+'d late':c.f.days_left+'d left'):''}</span>`,go:()=>{S.psel=c.id;location.hash='#/projects';render()}})));
  const done=q?n.done.filter(x=>hit(x.title+' '+x.file)).slice(0,4):[];if(done.length)items.push({h:'Archive'},...done.map(x=>({name:x.title,html:`${st(x.fate)}<span class="grow">${hl(x.title)}</span>`,go:()=>{S.af={q:'',fate:'all'};S.asel=x.file;location.hash='#/archive';render()}})));
  const cmds=[['Go to Inbox',()=>location.hash='#/inbox','1'],['Go to Projects',()=>location.hash='#/projects','2'],['Go to Archive',()=>location.hash='#/archive','3'],['Go to Pulse',()=>location.hash='#/pulse','4'],
    ['Undo last change',doUndo,'Z'],['Toggle dark mode',toggleTheme,''],['Refresh everything',async()=>{S.projects=null;S.stats=null;S.freshProjects=true;await refresh();loadActivity(true);render()},''],['Keyboard shortcuts',openKeys,'?']].filter(c=>hit(c[0]));
  if(cmds.length)items.push({h:'Commands'},...cmds.map(([l,go,k])=>({name:l,html:`<span class="grow">${hl(l)}</span>${k?kbh(k):''}`,go})));
  pal.items=items.filter(x=>!x.h);let idx=0,group='';
  const out=[];items.forEach((x,gi)=>{if(x.h){if(group)out.push('</div>');group=x.h;out.push(`<div role="group" aria-labelledby="pg${gi}"><div class="sect label" id="pg${gi}">${x.h}</div>`)}
    else{out.push(`<div class="r ${idx===pal.i?'on':''}" role="option" id="po${idx}" aria-selected="${idx===pal.i}" data-pi="${idx}">${x.html}</div>`);idx++}});
  if(group)out.push('</div>');
  $('#pres').innerHTML=pal.items.length?out.join(''):'<div class="empty" style="font-size:16px">No matches.</div>';
  $('#palStatus').textContent=pal.items.length?`${pal.items.length} result${pal.items.length===1?'':'s'}`:'No matches';
  $('#pq').setAttribute('aria-activedescendant',pal.items.length?'po'+pal.i:'');
  $$('#pres [data-pi]').forEach(r=>{r.onclick=()=>palGo(+r.dataset.pi);r.onmousemove=()=>{if(pal.i!==+r.dataset.pi)palSelect(+r.dataset.pi)}})}
function palGo(i){const it=pal&&pal.items[i];if(!it)return;closeOverlay(true);it.go();setTimeout(focusMain,60)}  // after any route change has rendered
// after a jump to another page the keyboard user should land on that page, not on whatever the palette was opened from
function focusMain(){const h=$('#main h1')||$('#main');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}

document.addEventListener('keydown',e=>{
  if(e.defaultPrevented)return;  // something closer already handled this key (a row opening itself, a button, a form)
  if(e.repeat&&e.key==='Enter')return;  // holding Enter must never repeat a decision
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal?closeOverlay():openPalette();return}
  if($('#overlay').innerHTML){
    if(e.key==='Escape'){e.preventDefault();closeOverlay();return}
    if(e.key==='Tab'){trapTab(e);return}
    if(pal){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(pal.items.length)palSelect(Math.max(0,Math.min(pal.items.length-1,pal.i+(e.key==='ArrowDown'?1:-1))))}
      if(e.key==='Enter'){e.preventDefault();palGo(pal.i)}}return}
  const t=e.target instanceof Element?e.target:document.body;
  if(t.matches('input,textarea,select')){
    if(e.key==='Escape'){if(t.id==='q'){t.blur();return}if(S.mode){setMode(null);return}t.blur();return}
    if(e.key==='Enter'&&t.closest('#form')&&(t.tagName!=='TEXTAREA'||e.ctrlKey||e.metaKey)){e.preventDefault();apply()}
    if(e.key==='Enter'&&t.id==='q'){e.preventDefault();t.blur()}
    return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  // Enter/Space on a button, link or other control belong to that control (it clicks itself), never to a page shortcut.
  if((k==='Enter'||k===' ')&&t.closest('button,a[href],[role=button],summary,.opt,.seg'))return;
  if(k==='/'){const q=$('#q');if(q){e.preventDefault();q.focus();q.select()}return}
  if(k==='?'){openKeys();return}
  if(k==='z'||k==='Z'){doUndo();return}
  if('1234'.includes(k)&&k.length===1){location.hash='#/'+['inbox','projects','archive','pulse'][+k-1];return}
  if(k==='Escape'){if(S.repo){S.repo=null;render()}else if(S.mode)setMode(null);else if(document.body.classList.contains('note')||document.body.classList.contains('detail'))backToList();else if(S.route==='projects'&&S.psel)selectProject(S.psel);return}
  const down=k==='j'||k==='ArrowDown',up=k==='k'||k==='ArrowUp';
  if(S.route==='inbox'&&S.notes){const ord=navOrder(inboxModel()),i=ord.indexOf(S.sel),stack=!!S.sel&&S.sel.startsWith('stack:');
    if(down||up){e.preventDefault();const n=ord[i+(down?1:-1)];if(n)selectNote(n);return}
    // Opening a stack and merging it are different acts: Enter only submits a batch after an action was chosen on purpose.
    if(k==='Enter'&&stack){if(S.armed===S.sel)apply();return}
    const m={p:'promote',r:'reference',c:'keep',x:'kill'}[k.toLowerCase()];if(m&&S.sel&&!stack){e.preventDefault();setMode(m);return}
    if(m&&stack){S.batchMode={promote:'merge',reference:'reference',keep:'keep',kill:'kill'}[m];S.armed=S.sel;renderBatch();return}
    if(k==='Enter'&&S.mode){apply();return}
    if(k==='y'){const el=$('#doc [data-copy]');if(el)copyPath(el.dataset.copy,el)}return}
  if(S.route==='archive'&&S.notes){const items=$$('#list [data-f]').map(r=>r.dataset.f),i=items.indexOf(S.asel);
    if(down||up){e.preventDefault();const n=items[i+(down?1:-1)];if(n){selectArchive(n);$('#list .sel')?.scrollIntoView({block:'nearest'})}return}
    if(k==='y'){const el=$('#doc [data-copy]');if(el)copyPath(el.dataset.copy,el)}return}
  if(S.route==='projects'&&!S.repo){const ids=$$('[data-pid]').map(b=>b.dataset.pid),i=ids.indexOf(S.psel);
    if(down||up){e.preventDefault();const n=ids[i+(down?1:-1)];if(n)selectProject(n)}
    if(k==='y'){const el=$('#drawer [data-copy]');if(el)copyPath(el.dataset.copy,el)}}});

/* ---------- routing ---------- */
function render(){
  cancelScopes();  // requests for the screen being replaced must not answer into the new one
  if(!S.notes){$('#main').innerHTML='<div class="empty">Loading…</div>';return}
  renderRail();
  if(S.repo&&S.repo.from===S.route)return renderRepo();S.repo=null;
  ({inbox:renderInbox,projects:renderProjects,archive:renderArchive,pulse:renderPulse}[S.route]||renderInbox)()}
let routed=false;
function route(){const r=(location.hash.match(/^#\/(\w+)/)||[])[1];const nr=['inbox','projects','archive','pulse'].includes(r)?r:'inbox';
  const moved=nr!==S.route;
  if(moved){S.mode=null;S.armed=null;S.repo=null;document.body.classList.remove('note','detail')}S.route=nr;render();
  if(moved&&routed)focusMain();routed=true}  // a keyboard or screen-reader user lands on the new page's heading
addEventListener('hashchange',route);
$('#mPal').onclick=openPalette;$('#mPal').innerHTML=I.search;
// coming back to the tab (or the phone app) picks up notes changed elsewhere, unless you're mid-decision
// a tab left open across a restart (or an old server still running) talks to a different API: say so
async function checkVersion(){try{const v=await api('/api/version');let b=$('#vbanner');
  if(v.version===VERSION){b&&b.remove();return}
  if(!b){b=document.createElement('div');b.id='vbanner';b.setAttribute('role','alert');document.body.prepend(b)}
  b.innerHTML=`This page is v${esc(VERSION)} but the server is v${esc(v.version)} (started ${esc(v.started.replace('T',' '))}). <button onclick="location.reload()">Reload the page</button>`}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion()});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||S.mode||$('#overlay').innerHTML)return;
  try{await refresh();if(!dirty())render()}catch(e){}});  // data is refreshed either way; the screen is redrawn only when nothing typed would be lost
(async()=>{try{await loadNotes()}catch(e){$('#main').innerHTML=`<div class="empty">Can't reach the triage server: ${esc(e.message)}</div>`;return}
  route();loadActivity();checkVersion();setInterval(()=>loadActivity(),600000)})();
</script></body></html>
