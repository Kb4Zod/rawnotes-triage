<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RawNotes · Triage __VERSION__</title>
<script>(()=>{const t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')})()</script>
<style>
@font-face{font-family:'Cormorant Garamond';src:url(/static/fonts/CormorantGaramond.woff2) format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url(/static/fonts/CormorantGaramond-italic.woff2) format('woff2');font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:Lato;src:url(/static/fonts/Lato-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Lato;src:url(/static/fonts/Lato-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Lato;src:url(/static/fonts/Lato-900.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(/static/fonts/JetBrainsMono.woff2) format('woff2');font-weight:100 800;font-display:swap}
:root{
  --bg:#f4f7f4;--glow1:rgba(203,168,90,.14);--glow2:rgba(43,122,84,.11);
  --surface:rgba(255,255,255,.80);--solid:#fff;--sunk:#edf2ee;
  --ink:#1f2924;--ink2:#3d4d45;--mute:#64766c;--line:rgba(43,122,84,.14);--line2:rgba(43,122,84,.30);
  --green:#2b7a54;--green-ink:#1e593d;--green-soft:rgba(43,122,84,.10);
  --gold:#cba85a;--gold-ink:#7f611a;--gold-soft:rgba(203,168,90,.18);
  --teal:#2f6f7e;--teal-ink:#245764;--teal-soft:rgba(47,111,126,.10);
  --rust:#b4533a;--rust-ink:#963f29;--rust-soft:rgba(180,83,58,.10);
  --g0:#e4ece6;--g1:#b9dcc6;--g2:#7fbf98;--g3:#3f9a6a;--g4:#1f6b47;
  --s1:#1f8467;--s2:#b5702a;--on-accent:#fff;
  --shadow:0 1px 2px rgba(31,41,36,.04),0 10px 30px rgba(31,41,36,.05);--shadow-lift:0 18px 40px rgba(43,122,84,.14);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:Lato,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
.dark{
  --bg:#0f1512;--glow1:rgba(217,185,106,.07);--glow2:rgba(95,191,141,.07);
  --surface:rgba(25,34,29,.82);--solid:#18201c;--sunk:#131a16;
  --ink:#e6ede8;--ink2:#c3d0c8;--mute:#8fa398;--line:rgba(143,216,176,.11);--line2:rgba(143,216,176,.26);
  --green:#5fbf8d;--green-ink:#8fd8b0;--green-soft:rgba(95,191,141,.12);
  --gold:#d9b96a;--gold-ink:#e3c886;--gold-soft:rgba(217,185,106,.13);
  --teal:#6fb3c4;--teal-ink:#97cbd8;--teal-soft:rgba(111,179,196,.12);
  --rust:#e07a5f;--rust-ink:#eb9a84;--rust-soft:rgba(224,122,95,.12);
  --g0:#1c2621;--g1:#1d4a33;--g2:#24704a;--g3:#35a06a;--g4:#6fd39c;
  --s1:#2b9c78;--s2:#c07f2c;--on-accent:#0f1512;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);--shadow-lift:0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 92% 0%,var(--glow1),transparent 45%),radial-gradient(circle at 0% 100%,var(--glow2),transparent 50%);background-attachment:fixed}
h1,h2,h3,h4,.serif,.num{font-family:var(--serif);font-weight:600;letter-spacing:.2px;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
#main{min-width:0;min-height:0;height:100vh;overflow:hidden}
/* rail */
.rail{display:flex;flex-direction:column;padding:22px 14px 16px;border-right:1px solid var(--line);background:var(--surface);backdrop-filter:blur(12px);min-height:0;overflow:auto}
.brand{padding:0 10px 18px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.brand .name{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.brand .name em{font-style:italic;color:var(--green)}
.brand .sub{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-ink);margin-top:6px;display:flex;align-items:center;gap:8px}
.brand .sub:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:700;font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--sunk)}
.nav a svg{width:18px;height:18px;opacity:.8}
.nav a .n{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700}
.nav a .n.alert{color:#fff;background:var(--rust);border-radius:10px;padding:0 7px}
.nav a.on{background:var(--green-soft);color:var(--green-ink);box-shadow:inset 3px 0 var(--green)}
.label{font:900 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.nav .label{padding:16px 10px 6px}
.lifecycle{margin:2px 10px 0;font-size:12px;color:var(--mute);display:grid;gap:4px}
.rail .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.rail .foot b{color:var(--ink)}
.spark{display:flex;gap:2px;align-items:flex-end;height:26px;margin:6px 0 8px}
.spark i{flex:1;background:var(--g3);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.foot .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px}
.linkish{background:none;border:0;padding:0;color:var(--mute);cursor:pointer;font-size:12px}
.linkish:hover{color:var(--ink)}
kbd{font:500 11px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:var(--solid);color:var(--ink2);white-space:nowrap}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* shared */
.pane-h{padding:22px 22px 12px}
.pane-h h1{font-size:34px;margin:0;line-height:1.05}
.pane-h .sub{color:var(--mute);font-size:13px;margin-top:4px}
.search{display:flex;align-items:center;gap:8px;margin-top:14px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--solid);color:var(--mute)}
.search input{flex:1;border:0;background:transparent;padding:9px 0;outline:none;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.chips{display:flex;margin-top:12px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--sunk)}
.chips.sm{margin-top:6px}.chips.sm .chip{padding:5px 6px;font-size:12px}
.chip{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border:0;border-right:1px solid var(--line);background:none;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip:last-child{border-right:0}.chip:hover{background:var(--solid)}
.chip b{font-weight:900;color:var(--mute)}
.chip.on{background:var(--green);color:var(--on-accent)}.chip.on b{color:inherit;opacity:.8}
.chip.warn b{color:var(--rust)}.chip.warn.on{background:var(--rust)}.chip.warn.on b{color:inherit}
.shipby{display:flex;gap:8px;align-items:stretch}.shipby .seg{flex:1}.shipby input[type=date]{width:auto;flex:none;padding:6px 8px}
.shipby input[type=date].on{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.flag{margin:0 0 14px;padding:10px 14px;border-radius:10px;border:1px solid var(--rust);color:var(--ink2);font-size:13px;background:var(--solid)}
#vbanner{position:sticky;top:0;z-index:50;padding:9px 16px;background:var(--gold);color:#1c1a12;font-weight:700;font-size:13px;text-align:center}
#vbanner button{margin-left:10px;font:inherit;text-decoration:underline;background:none;border:0;color:inherit;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.st.open,.st.cooking,.st.soon{color:var(--gold-ink);background:var(--gold-soft)}
.st.open .dot{border:2px solid var(--gold);width:9px;height:9px}.st.cooking .dot,.st.soon .dot{background:var(--gold)}
.st.promoted,.st.ok,.st.shipped{color:var(--green-ink);background:var(--green-soft)}.st.promoted .dot,.st.ok .dot,.st.shipped .dot{background:var(--green)}
.st.reference,.st.merged,.st.exp{color:var(--teal-ink);background:var(--teal-soft)}.st.reference .dot,.st.merged .dot,.st.exp .dot{background:var(--teal)}
.st.dead,.st.killed,.st.late{color:var(--rust-ink);background:var(--rust-soft)}.st.dead .dot,.st.killed .dot,.st.late .dot{background:var(--rust)}
.st.plain{color:var(--ink2);background:var(--sunk);padding-left:9px}.st.plain .dot{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 15px;border-radius:9px;border:1px solid var(--line2);background:var(--solid);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.danger{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:wait}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--mute)}
.err{color:var(--rust-ink);font-weight:700;font-size:13px}
.empty{color:var(--mute);padding:48px 20px;text-align:center;font-family:var(--serif);font-size:20px}
.copy{cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--mute);word-break:break-all}
.copy:hover{color:var(--ink)}
/* split view: Inbox and Archive */
.split{display:grid;grid-template-columns:400px 1fr;height:100vh;min-height:0}
.listpane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.list{overflow:auto;flex:1;padding:4px 10px 24px}
.grp-h{font:900 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding:14px 12px 6px;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:10px 12px 10px 0;border-radius:11px;cursor:pointer;margin-bottom:2px;align-items:center;border:1px solid transparent}
.item .bar{align-self:stretch;border-radius:3px;background:var(--line2)}
.item .bar.h1{background:var(--gold)}.item .bar.h2{background:var(--rust)}
.item .t{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item .age{font-weight:700;font-size:12px;color:var(--mute);text-align:right}
.item .age.a1{color:var(--gold-ink)}.item .age.a2{color:var(--rust)}
.item:hover{background:var(--sunk)}
.item.sel{background:var(--solid);box-shadow:var(--shadow);border-color:var(--line2)}
.item.stack{background:var(--solid);border:1px dashed var(--line2);padding:12px 12px 12px 0;margin:6px 0 10px;position:relative}
.item.stack.sel{border:1px solid var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.item.stack .t{font-family:var(--serif);font-size:19px;font-weight:700}
.item.stack .count{font:900 12px var(--sans);background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 9px}
.item.member{grid-template-columns:4px 22px 1fr auto;margin-left:14px}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:inline-grid;place-items:center;background:var(--solid);cursor:pointer;padding:0}
.cb.on{background:var(--green);border-color:var(--green)}
.cb.on:after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.reader{overflow:auto;min-height:0;padding:20px 32px 60px}
.back{display:none}
/* decide */
.decide{position:sticky;top:0;z-index:5;padding:14px;margin:-6px -6px 22px}
.decide.open{position:relative}
.decide .q{display:flex;align-items:baseline;gap:10px;margin:0 4px 12px;flex-wrap:wrap}
.decide .q h3{margin:0;font-size:21px}
.decide .q .muted{font-size:13px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opt{position:relative;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--solid);cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .15s;text-align:left}
.opt:hover{border-color:var(--line2)}
.opt .k{position:absolute;top:11px;right:11px}
.opt .v{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
.opt .v i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.opt .d{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.4}
.opt.promote .v i{background:var(--green-soft);color:var(--green)}
.opt.reference .v i{background:var(--teal-soft);color:var(--teal)}
.opt.keep .v i{background:var(--gold-soft);color:var(--gold-ink)}
.opt.kill .v i{background:var(--rust-soft);color:var(--rust)}
.opt.on.promote{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.opt.on.reference{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.opt.on.keep{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.opt.on.kill{border-color:var(--rust);box-shadow:0 0 0 3px var(--rust-soft)}
.opt.dim{opacity:.55}
.form{margin-top:14px;padding:18px 18px 16px;border-radius:12px;background:var(--solid);border:1px solid var(--line2);display:grid;grid-template-columns:1fr 300px;gap:22px}
.form.promote{border-color:var(--green)}.form.reference{border-color:var(--teal)}.form.keep{border-color:var(--gold)}.form.kill{border-color:var(--rust)}
.field{margin-bottom:14px}
.field>label,.field>.label{display:block;margin-bottom:6px}
.field label em{font-style:normal;color:var(--rust);letter-spacing:0;text-transform:none;font-weight:700;margin-left:6px}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;text-align:center;padding:8px 6px;font-weight:700;font-size:13px;color:var(--ink2);border:0;border-right:1px solid var(--line);background:none;cursor:pointer;line-height:1.3}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.seg button.on{background:var(--green);color:var(--on-accent)}.seg button.on small{color:inherit;opacity:.8}
.input{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);font-size:14px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
textarea.input{min-height:72px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.preview{background:var(--sunk);border-radius:10px;padding:14px;font-size:13px;align-self:start}
.preview .label{margin-bottom:10px}
.preview ol{margin:0;padding-left:18px}.preview li{margin-bottom:8px}
.preview .mono{word-break:break-all;color:var(--green-ink)}
.formfoot{grid-column:1/-1;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.formfoot .hint{margin-left:auto;font-size:12.5px;color:var(--mute)}
/* doc */
.doc{max-width:860px;padding:30px 40px 36px}
.doc .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc h1.title{font-size:44px;line-height:1.05;margin:16px 0 10px;overflow-wrap:anywhere}
.doc .path{margin-bottom:18px}
.ask{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 18px;border-radius:0 10px 10px 0;margin-bottom:10px}
.ask .label{color:var(--gold-ink);margin-bottom:4px}
.ask p{margin:0;font-family:var(--serif);font-size:20px;line-height:1.4;font-weight:500}
.outcome{border-left:3px solid var(--teal);background:var(--teal-soft);padding:12px 18px;border-radius:0 10px 10px 0;margin-bottom:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.md{overflow-wrap:anywhere}
.md h1{font-size:30px}.md h2{font-size:26px;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.md h3{font-size:20px;margin:20px 0 6px}.md h4{font-size:17px;margin:16px 0 4px}
.md p,.md li{color:var(--ink2);font-size:15px;line-height:1.7}
.md ul{padding-left:20px}
.md code{font:12.5px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:5px}
.md .tbl{overflow-x:auto;margin:10px 0}.md table{border-collapse:collapse;font-size:13.5px}.md td{border:1px solid var(--line2);padding:5px 9px;vertical-align:top;color:var(--ink2)}.md tr:first-child td{font-weight:700;background:var(--sunk)}
.md pre{background:var(--sunk);padding:12px;border-radius:8px;overflow:auto;font:12.5px/1.5 var(--mono)}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:11px 12px 11px 18px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lift);font-size:13.5px;z-index:60;transition:.2s;max-width:min(680px,92vw)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.bad{background:var(--rust);color:#fff}
#toast button{background:none;border:0;font-weight:900;color:var(--gold);cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.dark #toast button{color:#7f611a}
#toast kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.7}
/* batch */
.btable{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
.btable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.btable tr td:first-child{width:96px}
/* projects */
.scroll{overflow:auto;height:100vh;padding:0 28px 40px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 22px}
.tile{padding:14px 16px;text-align:left;cursor:default}
button.tile{cursor:pointer;font:inherit;color:inherit}
.tile .num{font-size:38px;font-weight:700;line-height:1}
.tile .lab{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;gap:6px;align-items:center}
.board{display:flex;gap:16px;align-items:flex-start;width:max-content;min-width:100%}
.board>.col{flex:1 0 260px;max-width:360px}
.board>.drawer{flex:0 0 380px}
.col h3{font:900 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.pc{padding:14px 15px;margin-bottom:10px;cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.pc:hover{border-color:var(--line2)}
.pc.sel{box-shadow:0 0 0 2px var(--green),var(--shadow-lift)}
.pc.closed{opacity:.6}
.pc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc h4{font-size:20px;margin:0;line-height:1.15;font-weight:700;overflow-wrap:anywhere}
.pc .dm{font-size:12.5px;color:var(--ink2);margin:8px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .dm.miss{color:var(--rust-ink);font-weight:700}
.pc .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--solid);display:grid;place-items:center;font:900 12px/1 var(--sans);text-align:center}

.drawer{padding:20px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}

.dod{border-left:3px solid var(--green);background:var(--green-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.5px}

.tl .muted{font-size:11.5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.clockbar{height:8px;border-radius:4px;background:var(--sunk);margin-top:8px;overflow:hidden}
.clockbar i{display:block;height:100%}
/* repo viewer */
.repohead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.crumbs{margin:2px 0 10px;color:var(--mute);overflow-wrap:anywhere}.crumbs a{text-decoration:none}

.repofiles a:last-child{border-bottom:0}.repofiles a:hover{background:var(--sunk)}.repofiles em{font-style:normal;color:var(--mute);font-size:12px}

.hm i.l1{background:var(--g1)}.hm i.l2{background:var(--g2)}.hm i.l3{background:var(--g3)}.hm i.l4{background:var(--g4)}
.hm i.today{outline:1.5px solid var(--ink);outline-offset:-1px}

.bars .b{display:grid;grid-template-columns:minmax(0,190px) 1fr 32px;gap:10px;align-items:center;font-size:13px;margin-bottom:4px;padding:3px 6px;border-radius:6px;cursor:pointer;width:100%;background:none;border:0;text-align:left}

.bars .fill{height:12px;border-radius:0 4px 4px 0;background:var(--g3)}
.bars .n{text-align:right;font-weight:700;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.chart rect{transition:opacity .15s}.chart g:hover rect{opacity:.8}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(15,21,18,.35);backdrop-filter:blur(3px);z-index:50;display:grid;justify-items:center;align-items:start;padding-top:12vh}

  .formfoot .hint{display:none}
  .doc{padding:20px 18px}.doc h1.title{font-size:32px}

</style></head><body>

</div>

<script>
const VERSION='__VERSION__';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent;
const narrow=()=>matchMedia('(max-width:800px)').matches;
const svg=d=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I={
 inbox:svg('<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>'),
 proj:svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h3M8 16h6"/>'),
 arch:svg('<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>'),
 pulse:svg('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'),
 ref:svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>'),
 search:svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'),
 up:svg('<path d="M12 19V5M5 12l7-7 7 7"/>'),
 pot:svg('<path d="M3 11h18v3a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/>'),
 x:svg('<path d="M18 6 6 18M6 6l12 12"/>'),

 check:svg('<path d="M20 6 9 17l-5-5"/>'),
 clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
 gh:svg('<path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>'),
 undo:svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
 restore:svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),
 moon:svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
 sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
 ext:svg('<path d="M7 17 17 7M8 7h9v9"/>'),

};

/* ---------- api ---------- */
async function api(path,body){
  const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j;try{j=await r.json()}catch(e){throw Error('The triage server sent something unexpected.')}
  if(j&&j.error&&!j.weeks)throw Error(j.error);return j}

/* ---------- state ---------- */
const S={route:'inbox',notes:null,projects:null,activity:null,stats:null,
  sel:null,mode:null,expanded:null,batch:new Set(),batchMode:'merge',
  f:{q:'',status:'all',type:null},af:{q:'',fate:'all'},asel:null,
  psel:null,pdetail:null,repo:null,undoCount:0};

/* ---------- small renderers ---------- */
const stLabel={open:'Open',cooking:'Cooking',promoted:'Promoted',reference:'Reference',dead:'Killed',killed:'Killed',merged:'Merged',shipped:'Shipped'};
const st=(s,txt)=>`<span class="st ${esc(s)}"><span class="dot"></span>${esc(txt??stLabel[s]??s)}</span>`;
const kb=k=>`<kbd>${k}</kbd>`;
const slugOf=f=>f.replace(/^(done\/)?\d{4}-\d{2}-\d{2}-/,'').replace(/\.md$/,'');
const ageCls=a=>a>60?2:a>=14?1:0;
const fmtDate=d=>{try{return new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}catch(e){return d}};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')};
function md(src){ // small markdown renderer: headings, lists, code, bold/italic, links
  const out=[];let inCode=false,inList=false,inTable=false,para=[];
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  const flush=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}if(inList){out.push('</ul>');inList=false}if(inTable){out.push('</table></div>');inTable=false}};
  for(const raw of src.split('\n')){
    if(raw.startsWith('```')){flush();inCode=!inCode;out.push(inCode?'<pre>':'</pre>');continue}
    if(inCode){out.push(esc(raw));continue}
    const h=raw.match(/^(#{1,5})\s+(.*)/);if(h){flush();const n=Math.min(h[1].length,4);out.push(`<h${n}>${inline(h[2])}</h${n}>`);continue}
    const li=raw.match(/^\s*[-*]\s+(.*)/);if(li){if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}if(!inList){out.push('<ul>');inList=true}out.push('<li>'+inline(li[1].replace(/<!--.*?-->/g,''))+'</li>');continue}
    if(/^\s*\|.*\|\s*$/.test(raw)){if(!inTable){flush();inTable=true;out.push('<div class="tbl"><table>')}
      const cells=raw.trim().slice(1,-1).split('|').map(c=>c.trim());if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;
      out.push('<tr>'+cells.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>');continue}
    if(inTable){out.push('</table></div>');inTable=false}
    if(raw.trim()===''){flush();continue}
    if(inList&&/^\s{2,}/.test(raw)){out[out.length-1]=out[out.length-1].replace(/<\/li>$/,' '+inline(raw.trim())+'</li>');continue}
    para.push(raw)}
  flush();return out.join('\n')}
// the note minus what the header already shows: title, "- key: value" lines, the question section
const noteBody=t=>t.replace(/^# .*\n/,'').replace(/^(\s*- (date|status|type|promoted|due):.*\n|\s*\n)+/,'').replace(/## What's the question[^\n]*\n[\s\S]*?(?=\n## |$)/,'').trim();

/* ---------- toast + undo ---------- */
let toastTimer;
function toast(msg,{undo=false,bad=false}={}){
  const t=$('#toast');t.className=bad?'bad':'';
  t.innerHTML=`<span>${bad?'':I.check} ${esc(msg)}</span>${undo?`<button type="button" id="tUndo">${I.undo}Undo ${kb('Z')}</button>`:''}`;
  if(undo)$('#tUndo').onclick=doUndo;
  requestAnimationFrame(()=>t.classList.add('show'));clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),bad?7000:9000)}
async function doUndo(){
  try{const r=await api('/api/undo',{});S.undoCount=r.left;toast(r.msg,{undo:r.left>0});
    await refresh();
    if(r.select){if(r.select.startsWith('done/')){if(S.notes.live.some(n=>n.file===r.select.slice(5)))S.sel=r.select.slice(5)}else if(S.notes.live.some(n=>n.file===r.select)){S.sel=r.select;S.expanded=null}}
    render()}
  catch(e){toast(e.message,{bad:true})}}

/* ---------- data ---------- */
async function loadNotes(){S.notes=await api('/api/notes')}
async function loadProjects(){S.projects=(await api('/api/projects')).projects}
async function loadActivity(force){try{S.activity=await api('/api/activity'+(force?'?refresh=1':''))}catch(e){S.activity={error:e.message}}renderRail()}
async function loadStats(){try{S.stats=await api('/api/stats')}catch(e){S.stats={error:e.message}}}
async function refresh(){await loadNotes();if(S.projects||S.route==='projects')await loadProjects().catch(()=>{});if(S.route==='pulse')await loadStats()}

/* ---------- rail & tabbar ---------- */
function counts(){const n=S.notes;if(!n)return{};const late=n.inflight.filter(x=>!x.done&&x.days_left!==null&&x.days_left<0).length;
  return{live:n.live.length,done:n.done.length,late,flight:n.inflight.filter(x=>!x.done).length}}
function renderRail(){
  const c=counts(),a=S.activity,dark=document.documentElement.classList.contains('dark');
  const nav=(id,ic,label,n,alert)=>`<a href="#/${id}" class="${S.route===id?'on':''}">${I[ic]}${label}<span class="n ${alert?'alert':''}">${n??''}</span></a>`;
  let spark='';if(a&&a.weeks){const wk=a.weeks.slice(-16).map(w=>w.reduce((s,d)=>s+d.count,0)),mx=Math.max(...wk,1);
    spark=`<div class="spark" title="Commits pushed per week, last 16 weeks">${wk.map(v=>`<i style="height:${Math.max(8,v/mx*100)}%"></i>`).join('')}</div><b>${a.total}</b> pushes this year · streak <b>${a.streak}d</b>`}
  else if(a&&a.error)spark=`<span title="${esc(a.error)}">GitHub activity unavailable</span>`;
  $('#rail').innerHTML=`<div class="brand"><div class="name">Raw<em>Notes</em></div><div class="sub">Triage</div></div>
  <div class="nav">${nav('inbox','inbox','Inbox',c.live)}${nav('projects','proj','Projects',c.late||c.flight,!!c.late)}${nav('archive','arch','Archive',c.done)}${nav('pulse','pulse','Pulse')}
  <div class="label">Lifecycle</div>
  <div class="lifecycle"><div>${st('open')} <span>captured</span></div><div>${st('cooking')} <span>being worked</span></div><div style="font-size:11px;margin-top:2px">then one of</div>
  <div>${st('promoted')} → Projects</div><div>${st('reference')} → reference/</div><div>${st('killed')} → Archive</div></div></div>
  <div class="foot">${spark}
   <div class="row"><button class="linkish" id="kPal">${kb('Ctrl K')} search</button><button class="linkish" id="kKeys">${kb('?')} keys</button></div>
   <div class="row"><button class="linkish" id="theme">${dark?I.sun:I.moon} ${dark?'Light':'Dark'}</button><span>v${VERSION}</span></div></div>`;
  $('#kPal').onclick=openPalette;$('#kKeys').onclick=openKeys;$('#theme').onclick=toggleTheme;
  const tab=(id,ic,label,bd)=>`<a href="#/${id}" class="${S.route===id?'on':''}">${I[ic]}${bd?`<span class="bd">${bd}</span>`:''}${label}</a>`;
  $('#tabbar').innerHTML=tab('inbox','inbox','Inbox')+tab('projects','proj','Projects',c.late)+tab('archive','arch','Archive')+tab('pulse','pulse','Pulse')}
function toggleTheme(){const d=document.documentElement.classList.toggle('dark');localStorage.setItem('theme',d?'dark':'light');renderRail();if(S.route==='pulse')render()}

/* ---------- Inbox model ---------- */
const DECIDED=['promoted','dead','killed','merged','shipped','done','reference'];
const stuck=n=>DECIDED.includes((n.status||'').toLowerCase());  // e.g. status: promoted but still in RawNotes/
function passes(n){const f=S.f;
  if(f.status==='stuck'&&!stuck(n))return false;
  if(f.status==='open'&&n.status!=='open')return false;
  if(f.status==='cooking'&&n.status!=='cooking')return false;
  if(f.status==='stale'&&!n.stale)return false;
  if(f.type&&n.type!==f.type)return false;
  if(f.q){const q=f.q.toLowerCase();if(!(n.title+' '+n.question+' '+n.file).toLowerCase().includes(q))return false}
  return true}
const stackKey=n=>slugOf(n.file).split('-').slice(0,2).join('-');
function stackName(ms){const words=ms.map(n=>n.title.split(/\s+/));let k=0;
  while(words.every(w=>w[k]!==undefined&&w[k].toLowerCase().replace(/[:—–-]+$/,'')===words[0][k].toLowerCase().replace(/[:—–-]+$/,'')))k++;
  const s=words[0].slice(0,k).join(' ').replace(/[\s:—–-]+$/,'');
  return s.length>2?s:slugOf(ms[0].file).split('-').slice(0,2).join(' ').replace(/^./,c=>c.toUpperCase())}
function inboxModel(){
  const live=S.notes.live.filter(passes);const by={};
  if(!S.f.q)live.forEach(n=>{(by[stackKey(n)]=by[stackKey(n)]||[]).push(n)});
  const stacks={};for(const k in by)if(by[k].length>=3)stacks[k]={key:k,members:by[k],name:stackName(by[k])};
  const older=[],recent=[],seen=new Set();
  for(const n of live){const k=stackKey(n),s=stacks[k];
    if(s){if(seen.has(k))continue;seen.add(k);const newest=Math.min(...s.members.map(m=>m.age??0));(newest>=14?older:recent).push({kind:'stack',...s});continue}
    ((n.age??0)>=14?older:recent).push({kind:'note',n})}
  return{older,recent,stacks,count:live.length}}
function navOrder(m){const out=[];for(const e of[...m.older,...m.recent]){if(e.kind==='note')out.push(e.n.file);else{out.push('stack:'+e.key);if(S.expanded===e.key)e.members.forEach(n=>out.push(n.file))}}return out}

/* ---------- Inbox view ---------- */
function renderInbox(){
  const m=inboxModel(),live=S.notes.live;
  const ord=navOrder(m);
  if(!S.sel||!ord.includes(S.sel))S.sel=ord[0]||null;
  if(S.sel&&S.sel.startsWith('stack:'))S.expanded=S.sel.slice(6);
  const cnt=s=>live.filter(n=>s==='stale'?n.stale:s==='stuck'?stuck(n):n.status===s).length,nstuck=cnt('stuck');
  if(S.f.status==='stuck'&&!nstuck)S.f.status='all';
  const chip=(v,label,n,cls='')=>`<button class="chip ${cls} ${S.f.status===v?'on':''}" data-st="${v}" aria-pressed="${S.f.status===v}">${label} <b>${n}</b></button>`;
  const tchip=v=>`<button class="chip ${(S.f.type||'')===v?'on':''}" data-ty="${v}" aria-pressed="${(S.f.type||'')===v}">${v?v[0].toUpperCase()+v.slice(1):'Any type'}</button>`;
  $('#main').innerHTML=`<div class="split"><div class="listpane"><div class="pane-h"><h1>Inbox</h1>
    <div class="sub">${live.length} note${live.length===1?'':'s'} waiting on a decision · oldest first</div>
    <label class="search">${I.search}<input id="q" placeholder="Search notes…" value="${esc(S.f.q)}" autocomplete="off">${kb('/')}</label>
    <div class="chips" role="group" aria-label="Status">${chip('all','All',live.length)}${chip('open','Open',cnt('open'))}${chip('cooking','Cooking',cnt('cooking'))}${chip('stale','Stale',cnt('stale'))}${nstuck?chip('stuck','Stuck',nstuck,'warn'):''}</div>
    <div class="chips sm" role="group" aria-label="Type">${tchip('')}${tchip('question')}${tchip('research')}${tchip('issue')}</div></div>
    <div class="list" id="list"></div></div><div class="reader" id="reader"></div></div>`;
  $('#q').oninput=e=>{S.f.q=e.target.value;renderInboxList(true)};
  $$('[data-st]').forEach(b=>b.onclick=()=>{S.f.status=b.dataset.st;renderInbox()});
  $$('[data-ty]').forEach(b=>b.onclick=()=>{S.f.type=b.dataset.ty||null;renderInbox()});
  renderInboxList();renderReader()}
function renderInboxList(fromSearch){
  const m=inboxModel(),el=$('#list');if(!el)return;
  const row=n=>{const a=n.age??0,c=ageCls(a);return `<div class="item ${n.file===S.sel?'sel':''}" data-f="${esc(n.file)}" role="button" tabindex="0">
    <span class="bar ${c?'h'+c:''}"></span><div><div class="t">${esc(n.title)}</div><div class="m">${st(n.status)}<span>${esc(n.type)}</span>${n.stale?'<span class="err">stale</span>':''}${stuck(n)?'<span class="err" title="Its status says it was decided, but it is still in the Inbox">not moved</span>':''}</div></div><span class="age ${c?'a'+c:''}" title="waiting ${a} days">${a}d</span></div>`};
  const member=n=>`<div class="item member ${n.file===S.sel?'sel':''}" data-f="${esc(n.file)}" role="button" tabindex="0"><span class="bar"></span>
    <button class="cb ${S.batch.has(n.file)?'on':''}" data-cb="${esc(n.file)}" aria-label="Select"></button><div><div class="t" style="font-weight:${S.batch.has(n.file)?700:400}">${esc(n.title)}</div></div><span class="age">${n.age}d</span></div>`;
  const ent=e=>{if(e.kind==='note')return row(e.n);const open=S.expanded===e.key,id='stack:'+e.key;
    const dates=e.members.map(n=>n.date).sort();
    return `<div class="item stack ${S.sel===id?'sel':''}" data-f="${esc(id)}" role="button" tabindex="0"><span class="bar"></span><div><div class="t">${esc(e.name)}</div>
      <div class="m">${e.members.length} related notes · ${dates[0]===dates.at(-1)?dates[0]:dates[0].slice(5)+' – '+dates.at(-1).slice(5)} · ${open?'decide them together':'click to open'}</div></div><span class="count">${e.members.length}</span></div>`+(open?e.members.map(member).join(''):'')};
  const grp=(label,es)=>es.length?`<div class="grp-h"><span>${label}</span><span>${es.reduce((s,e)=>s+(e.kind==='note'?1:e.members.length),0)}</span></div>${es.map(ent).join('')}`:'';
  el.innerHTML=m.count?grp('Waiting 2+ weeks',m.older)+grp('This fortnight',m.recent):`<div class="empty">${S.notes.live.length?'Nothing matches.':'Inbox zero. Go build something.'}</div>`;
  el.querySelectorAll('[data-f]').forEach(r=>{r.onclick=e=>{if(e.target.closest('[data-cb]'))return;selectNote(r.dataset.f,true)};
    r.onkeydown=e=>{if(e.key==='Enter'&&e.target===r){e.preventDefault();selectNote(r.dataset.f,true)}}});
  el.querySelectorAll('[data-cb]').forEach(b=>b.onclick=e=>{e.stopPropagation();const f=b.dataset.cb;S.batch.has(f)?S.batch.delete(f):S.batch.add(f);renderInboxList();if(S.sel&&S.sel.startsWith('stack:'))renderBatchSummary()});
  if(fromSearch){const ord=navOrder(m);if(!ord.includes(S.sel)){S.sel=ord[0]||null;S.mode=null;renderReader()}}
  const s=el.querySelector('.sel');if(s&&!fromSearch)s.scrollIntoView({block:'nearest'})}
function selectNote(f,nav){
  if(f.startsWith('stack:')){const k=f.slice(6);if(S.expanded!==k){S.expanded=k;const st=inboxModel().stacks[k];S.batch=new Set(st?st.members.map(n=>n.file):[]);S.batchMode='merge'}}
  else{const n=S.notes.live.find(x=>x.file===f);if(n&&stackKey(n)!==S.expanded)S.expanded=null}
  S.sel=f;S.mode=null;renderInboxList();renderReader();
  if(nav&&narrow()){document.body.classList.add('note');scrollTo(0,0)}}

function optCards(on){const o=(id,ic,v,d,k)=>`<button type="button" class="opt ${id} ${on===id?'on':on?'dim':''}" data-m="${id}"><span class="k">${kb(k)}</span><div class="v"><i>${I[ic]}</i>${v}</div><div class="d">${d}</div></button>`;
  return `<div class="opts">${o('promote','up','Promote','Make it a project with a ship-by date','P')}${o('reference','ref','Reference','File it in reference/ for lookup','R')}${o('keep','pot','Keep','Still cooking: stays in the Inbox','C')}${o('kill','x','Kill','Not worth it: off to the Archive','X')}</div>`}
function seg(name,items,on){return `<div class="seg" data-seg="${name}">${items.map(([v,l,s])=>`<button type="button" data-v="${v}" class="${v===on?'on':''}">${l}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>`}
const segVal=name=>{const b=document.querySelector(`[data-seg="${name}"] .on`);return b?b.dataset.v:null};
function wireSegs(root,onChange){root.querySelectorAll('[data-seg]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));onChange&&onChange()}))}

// Ship by: day buttons or an exact date, whichever was touched last. Experiments have no ship-by.
function shipBy(days){const min=addDays(1),max=addDays(365);
  return `<div class="field" id="shipby"><span class="label">Ship by</span><div class="shipby">${seg('due',days.map(d=>[d,d+'d']),'7')}<input type="date" class="input" id="dueDate" min="${min}" max="${max}" aria-label="Exact ship-by date"></div></div>`}
function wireShipBy(root,onChange){const dd=root.querySelector('#dueDate');if(!dd)return;
  const days=[...root.querySelectorAll('[data-seg="due"] button')];let last=segVal('due')||'7';
  dd.oninput=()=>{dd.classList.toggle('on',!!dd.value);days.forEach(b=>b.classList.toggle('on',!dd.value&&b.dataset.v===last));onChange&&onChange()};
  days.forEach(b=>b.addEventListener('click',()=>{last=b.dataset.v;dd.value='';dd.classList.remove('on');onChange&&onChange()}))}
const shipDate=()=>{const dd=$('#dueDate');return dd&&dd.value?dd.value:addDays(+segVal('due')||7)};
const shipBody=dest=>{if(dest==='experiments')return{};const dd=$('#dueDate');return dd&&dd.value?{due:dd.value}:{due_days:segVal('due')}};
function syncShipBy(dest){const sb=$('#shipby');if(sb)sb.style.display=dest==='experiments'?'none':'';
  const n=$('#note');if(n)n.placeholder=dest==='experiments'?'What will you know or have when this experiment is done?':'What does shipped look like? One or two sentences.'}
function formHtml(mode,n){const s=slugOf(n.file);
  const foot=(btn,cls,hint)=>`<div class="formfoot"><button type="submit" class="btn ${cls}" id="go">${btn} ${kb('↵')}</button><button type="button" class="btn ghost" id="cancel">Cancel ${kb('Esc')}</button><span class="err" id="ferr"></span><span class="hint">${hint}</span></div>`;
  if(mode==='promote')return `<form class="form promote" id="form"><div>
    <div class="field"><span class="label">Promote to</span>${seg('dest',[['active','Active','ship it'],['experiments','Experiment','spike'],['learning','Learning','study'],['templates','Template','scaffold']],'active')}</div>
    <div class="two"><div class="field"><label class="label" for="slug">Project name</label><input class="input mono" id="slug" value="${esc(s)}" autocomplete="off"></div>
    ${shipBy(['3','7','14','30'])}</div>
    <div class="field"><label class="label" for="note">Done means <em>required</em></label><textarea class="input" id="note" rows="3" placeholder="What does shipped look like? One or two sentences."></textarea></div></div>
    <div class="preview" id="pv"></div>${foot(I.up+'Promote &amp; next','primary','Undo afterwards with Z · every move is logged')}</form>`;
  if(mode==='reference')return `<form class="form reference" id="form"><div>
    <div class="field"><label class="label" for="slug">File name</label><input class="input mono" id="slug" value="${esc(s)}" autocomplete="off"></div>
    <div class="field"><label class="label" for="note">Why keep it</label><input class="input" id="note" placeholder="optional: what this is a reference for"></div></div>
    <div class="preview" id="pv"></div>${foot(I.ref+'File as reference','primary','Shows up in Obsidian under Reference/')}</form>`;
  if(mode==='keep')return `<form class="form keep" id="form"><div>
    <div class="field"><span class="label">Status</span>${seg('status',[['cooking','Cooking',"I'm working it"],['open','Open','still just a question']],n.status==='open'?'open':'cooking')}</div>
    <div class="field"><label class="label" for="note">Next step</label><input class="input" id="note" placeholder="optional: the one thing to do next"></div></div>
    <div class="preview"><div class="label">What will happen</div><ol><li>Sets the status and adds the next step under ## Notes</li><li>The note stays in the Inbox; you move on to the next one</li></ol></div>${foot(I.pot+'Keep &amp; next','primary','')}</form>`;
  return `<form class="form kill" id="form"><div>
    <div class="field"><label class="label" for="note">Why not</label><input class="input" id="note" placeholder="one line: why this died (optional)"></div></div>
    <div class="preview"><div class="label">What will happen</div><ol><li>Sets <b>status: dead</b> and writes your reason under ## Outcome</li><li>Moves the note to <span class="mono">RawNotes/done/</span>; it shows up in the <b>Archive</b></li></ol></div>${foot(I.x+'Kill &amp; next','danger','Restore it from the Archive any time')}</form>`}
function updatePreview(){const pv=$('#pv');if(!pv||!S.mode)return;const slug=($('#slug')?.value||'').toLowerCase().replace(/[^a-z0-9-]/g,'')||'…';
  if(S.mode==='promote'){const d=segVal('dest'),folder=d==='active'||d==='experiments',exp=d==='experiments',due=shipDate();syncShipBy(d);
    const days=Math.round((new Date(due+'T00:00')-new Date(addDays(0)+'T00:00'))/864e5);
    pv.innerHTML=`<div class="label">What will happen</div><ol><li>Creates <span class="mono">~/Projects/${d}/${slug}${folder?'/NOTES.md':'.md'}</span></li>
      <li>Stamps <b>promoted</b> today · ${exp?'<b>no ship-by date</b> (open-ended)':`<b>ship by ${fmtDate(due)}</b>`}</li><li>Writes your <b>done means</b> into its ## Plan</li><li>Moves the capture to <span class="mono">RawNotes/done/</span></li><li>Shows up in <b>Projects</b> ${exp?'under Experiments, no clock':`with a ${days}-day clock`}</li></ol>`}
  if(S.mode==='reference')pv.innerHTML=`<div class="label">What will happen</div><ol><li>Copies to <span class="mono">~/Projects/reference/${slug}.md</span> with Obsidian properties</li><li>Moves the capture to <span class="mono">RawNotes/done/</span></li><li>Add it to <span class="mono">reference/README.md</span> if it belongs in the index</li></ol>`}

function renderReader(){const r=$('#reader');if(!r)return;r.scrollTop=0;
  if(!S.sel){r.innerHTML=`<div class="empty">${S.notes.live.length?'Pick a note.':'Inbox zero. Nothing to decide.'}</div>`;return}
  if(S.sel.startsWith('stack:'))return renderBatch();
  const n=S.notes.live.find(x=>x.file===S.sel);if(!n){r.innerHTML='';return}
  r.innerHTML=`<button class="back" onclick="backToList()">‹ Inbox</button>
   <div class="card decide ${S.mode?'open':''}" id="decide"><div class="q"><h3>What happens to this note?</h3><span class="muted">waiting ${n.age} day${n.age===1?'':'s'}</span><span class="muted kh" style="margin-left:auto">${kb('J')} ${kb('K')} next / prev</span></div>
   ${stuck(n)?`<div class="flag"><b>Stuck:</b> this note says <span class="mono">status: ${esc(n.status)}</span> but never left the Inbox. Check that its destination exists, then move it to <span class="mono">done/</span> yourself, or Keep it to put it back in play.</div>`:''}
   ${optCards(S.mode)}${S.mode?formHtml(S.mode,n):''}</div><div id="doc" class="card doc"><div class="muted">Loading…</div></div>`;
  wireDecide(n);loadDoc(n)}
function wireDecide(n){
  $$('#decide .opt').forEach(b=>b.onclick=()=>setMode(S.mode===b.dataset.m?null:b.dataset.m));
  const f=$('#form');if(!f)return;
  wireSegs(f,updatePreview);wireShipBy(f,updatePreview);$('#slug')&&($('#slug').oninput=updatePreview);updatePreview();
  f.onsubmit=e=>{e.preventDefault();apply()};$('#cancel').onclick=()=>setMode(null);
  const first=f.querySelector('textarea,input#note')||f.querySelector('input');if(first&&!narrow())first.focus()}
function setMode(m){if(!S.sel||S.sel.startsWith('stack:'))return;S.mode=m;const n=S.notes.live.find(x=>x.file===S.sel);
  const d=$('#decide');d.classList.toggle('open',!!m);
  d.innerHTML=d.innerHTML.split('<div class="opts">')[0]+optCards(m)+(m?formHtml(m,n):'');wireDecide(n);
  if(m&&!narrow())d.scrollIntoView({block:'nearest'})}
async function loadDoc(n){
  try{const j=await api('/api/note?f='+enc(n.file));if(S.sel!==n.file)return;
    $('#doc').innerHTML=docHtml(n,j.text);wireCopy($('#doc'))}
  catch(e){if(S.sel===n.file)$('#doc').innerHTML=`<p class="err">${esc(e.message)}</p>`}}
function docHtml(n,text,extra=''){
  const age=n.age??0;
  return `<div class="meta">${st(n.fate||n.status)}<span class="st plain">${esc(n.type)}</span><span class="st plain">Captured ${esc(n.date)}</span>${n.fate?'':`<span class="st ${age>=14?'soon':'plain'}">${I.clock} waiting ${age} day${age===1?'':'s'}</span>`}</div>
  <h1 class="title">${esc(n.title)}</h1><div class="path"><span class="copy mono" data-copy="${esc(n.abs_path)}" tabindex="0" role="button" title="Copy full path ( Y )">${I.copy}<span>RawNotes/${esc(n.file)}</span></span></div>
  ${extra}${n.question?`<div class="ask"><div class="label">The question</div><p>${esc(n.question.replace(/\s+/g,' '))}</p></div>`:''}
  <div class="md">${md(noteBody(text||''))}</div>`}
function wireCopy(root){root.querySelectorAll('[data-copy]').forEach(el=>{const go=()=>copyPath(el.dataset.copy,el);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
async function copyPath(path,el){try{await navigator.clipboard.writeText(path)}catch(e){toast('Copy needs a secure page (localhost or HTTPS).',{bad:true});return}
  const s=el&&el.querySelector('span:last-child');if(s){const o=s.textContent;s.textContent='Copied';setTimeout(()=>s.textContent=o,1000)}}
function backToList(){document.body.classList.remove('note','detail');S.mode=null;if(S.route==='inbox'||S.route==='archive')render();scrollTo(0,0)}

async function apply(){
  if(S.sel&&S.sel.startsWith('stack:'))return applyBatch();
  if(!S.mode||!S.sel)return;const go=$('#go'),err=$('#ferr');
  const val=id=>{const e=document.getElementById(id);return e?e.value.trim():undefined};
  const body={file:S.sel,action:S.mode,note:val('note'),slug:val('slug'),dest:segVal('dest'),status:segVal('status'),...(S.mode==='promote'?shipBody(segVal('dest')):{})};
  if(S.mode==='promote'&&!body.note){err.textContent='Say what done means first.';$('#note').focus();return}
  go.disabled=true;err.textContent='';
  try{const ord=navOrder(inboxModel()),i=ord.indexOf(S.sel);
    const r=await api('/api/action',body);S.undoCount++;
    const next=ord.slice(i+1).find(f=>!f.startsWith('stack:'))||ord.slice(0,i).reverse().find(f=>!f.startsWith('stack:'));
    await loadNotes();S.sel=next&&S.notes.live.some(n=>n.file===next)?next:null;S.mode=null;
    toast(r.msg,{undo:true});render()}
  catch(e){go.disabled=false;err.textContent=e.message}}

/* ---------- stacks: batch + merge ---------- */
function renderBatch(){const k=S.sel.slice(6),stk=inboxModel().stacks[k];const r=$('#reader');
  if(!stk){r.innerHTML='<div class="empty">That stack is gone.</div>';return}
  const o=(id,ic,v,d)=>`<button type="button" class="opt ${id==='merge'?'promote':id} ${S.batchMode===id?'on':'dim'}" data-bm="${id}"><div class="v"><i>${I[ic]}</i>${v}</div><div class="d">${d}</div></button>`;
  r.innerHTML=`<button class="back" onclick="backToList()">‹ Inbox</button><div class="card decide open" id="decide"><div class="q"><h3 id="bcount"></h3><span class="muted">batch decision · tick notes in the list</span></div>
   <div class="opts" style="grid-template-columns:1.3fr 1fr 1fr 1fr">${o('merge','merge','Merge into one','Combine into a single note, newest first')}${o('reference','ref','Reference all','File each one in reference/')}${o('keep','pot','Keep all','Set status in one go')}${o('kill','x','Kill all','One reason for all of them')}</div>
   <form class="form ${S.batchMode==='merge'?'promote':S.batchMode}" id="form">${batchForm(stk)}</form></div>
   <div class="card doc" style="padding:22px 28px"><h3 style="margin:0 0 6px;font-size:22px">Selected notes</h3><table class="btable" id="btable"></table></div>`;
  $$('[data-bm]').forEach(b=>b.onclick=()=>{S.batchMode=b.dataset.bm;renderBatch()});
  const f=$('#form'),sync=()=>{if(S.batchMode==='merge'){$('#promoteBits').style.display=segVal('then')==='promote'?'':'none';syncShipBy(segVal('dest'));batchPreview()}};wireSegs(f,sync);
  f.onsubmit=e=>{e.preventDefault();apply()};$('#cancel').onclick=()=>{S.sel=stk.members[0].file;S.expanded=k;renderInboxList();renderReader()};
  f.querySelectorAll('input,textarea').forEach(i=>i.oninput=batchPreview);wireShipBy(f,sync);  // after: it owns #dueDate's oninput
  renderBatchSummary()}
function batchForm(stk){const m=S.batchMode;
  const foot=(btn,cls)=>`<div class="formfoot"><button type="submit" class="btn ${cls}" id="go">${btn} ${kb('↵')}</button><button type="button" class="btn ghost" id="cancel">Cancel</button><span class="err" id="ferr"></span><span class="hint" id="bleft"></span></div>`;
  if(m==='merge')return `<div><div class="field"><label class="label" for="mtitle">Merged note title</label><input class="input" id="mtitle" value="${esc(stk.name)}"></div>
    <div class="field"><span class="label">Then</span>${seg('then',[['inbox','Leave in Inbox'],['promote','Promote it','new project'],['reference','File as reference']],'inbox')}</div>
    <div id="promoteBits" style="display:none"><div class="two"><div class="field"><span class="label">Promote to</span>${seg('dest',[['active','Active'],['experiments','Experiment']],'active')}</div>
      ${shipBy(['3','7','14'])}</div>
      <div class="field"><label class="label" for="slug">Project name</label><input class="input mono" id="slug" value="${esc(stackKey(stk.members[0]))}"></div>
      <div class="field"><label class="label" for="note">Done means <em>required</em></label><textarea class="input" id="note" rows="2"></textarea></div></div></div>
    <div class="preview" id="pv"></div>${foot(I.merge+'Merge','primary')}`;
  if(m==='reference')return `<div><div class="field"><label class="label" for="note">Why keep them</label><input class="input" id="note" placeholder="optional, applied to each"></div></div><div class="preview" id="pv"></div>${foot(I.ref+'File all','primary')}`;
  if(m==='keep')return `<div><div class="field"><span class="label">Status</span>${seg('status',[['cooking','Cooking'],['open','Open']],'cooking')}</div><div class="field"><label class="label" for="note">Next step</label><input class="input" id="note" placeholder="optional, added to each"></div></div><div class="preview" id="pv"></div>${foot(I.pot+'Keep all','primary')}`;
  return `<div><div class="field"><label class="label" for="note">Why not</label><input class="input" id="note" placeholder="one line, written into each note"></div></div><div class="preview" id="pv"></div>${foot(I.x+'Kill all','danger')}`}
function batchPreview(){const pv=$('#pv');if(!pv)return;const n=S.batch.size,m=S.batchMode,t=new Date().toLocaleDateString('sv');
  if(m==='merge'){const title=($('#mtitle')?.value||'merged').trim(),slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60),then=segVal('then');
    const kb_=S.notes.live.filter(x=>S.batch.has(x.file)).reduce((a,x)=>a+x.size,0)/1024,size=kb_>=1024?(kb_/1024).toFixed(1)+' MB':Math.round(kb_)+' KB';

  const used=new Set(cards.filter(c=>c.p).map(c=>c.p.path));

const CLOSED=['done','shipped','dead'];

function ring(f){if(!f||f.days_left===null)return'';const l=f.days_left;

  return `<div class="ring" style="background:conic-gradient(${c} ${p*360}deg,var(--sunk) 0)" title="${l<0?-l+' days late':l+' days left'}"><span><span>${Math.abs(l)}d<small>${l<0?'LATE':'LEFT'}</small></span></span></div>`}
function ghChip(g){if(!g)return'';return g.pushed?(g.unpushed?st('soon','GH ↑'+g.unpushed):st('ok','On GitHub')):g.repo?st('late','Not pushed'):g.git?st('plain','Local git'):st('plain','No git')}

  try{const j=await api(path?`/api/repo/path?name=${enc(name)}&path=${enc(path)}`:`/api/repo?name=${enc(name)}`);if(S.repo!==rs)return;let html;
    if(!path){const r=j.repo,note=k=>j.errors[k]?`<p class="err">Couldn't load: ${esc(j.errors[k])}</p>`:'';
      html=bar(r.url)+`<h1 class="title" style="font-size:38px">${r.private?'🔒 ':''}${esc(r.name)}</h1><p class="muted">${esc(r.description||'No description')} · default branch <code>${esc(r.default_branch)}</code> · last push ${esc(r.pushed_at)}${r.archived?' · archived':''}</p>
      <div class="md"><h2>Files</h2>${files(j.tree)}${note('tree')}<h2>${j.readme?esc(j.readme.name):'README'}</h2>${j.readme?md(j.readme.text):'<p class="muted">No README.</p>'}
      <h2>Recent commits</h2>${j.commits.length?'<ul>'+j.commits.map(c=>`<li>${esc(c.title)} <span class="muted">· ${esc(c.date)} · ${esc(c.sha)} · ${esc(c.author)}</span></li>`).join('')+'</ul>':'<p class="muted">No commits.</p>'}${note('commits')}
      <h2>Pull requests</h2>${j.prs.length?'<ul>'+j.prs.map(x=>`<li>#${x.number} ${esc(x.title)} ${st(x.state==='merged'?'promoted':x.state==='open'?'cooking':'plain',x.state)} <span class="muted">${esc(x.updated)}</span></li>`).join('')+'</ul>':'<p class="muted">No pull requests.</p>'}${note('prs')}
      <h2>Open issues</h2>${j.issues.length?'<ul>'+j.issues.map(x=>`<li>#${x.number} ${esc(x.title)} <span class="muted">${esc(x.updated)} · ${x.comments} comment${x.comments===1?'':'s'}</span></li>`).join('')+'</ul>':'<p class="muted">No open issues.</p>'}${note('issues')}</div>`}
    else{const segs=path.split('/');const crumbs=`<div class="crumbs"><a href="#" data-rp="">${esc(name)}</a>`+segs.map((s,i)=>i===segs.length-1?` / <b>${esc(s)}</b>`:` / <a href="#" data-rp="${esc(segs.slice(0,i+1).join('/'))}">${esc(s)}</a>`).join('')+'</div>';
      let body;if(j.kind==='dir')body=files(j.entries);else if(j.too_large)body=`<p class="muted">Too large to show here (${fmtSize(j.size)}).</p>`;else if(j.binary||j.kind==='other')body=`<p class="muted">${j.binary?'Binary file':'Not a regular file'}; open it on GitHub.</p>`;
      else body=/\.(md|markdown)$/i.test(j.name)?`<div class="md">${md(j.text)}</div>`:`<div class="md"><pre>${esc(j.text)}</pre></div>`;
      html=bar(j.url||'https://github.com/'+name)+crumbs+body}
    $('#repo').innerHTML=html;wire()}
  catch(e){if(S.repo!==rs)return;$('#repo').innerHTML=bar('https://github.com/'+name)+`<p class="err">${esc(e.message)}</p>`;wire()}}

/* ---------- Pulse ---------- */
function renderPulse(){
  const a=S.activity,s=S.stats;
  if(!s){$('#main').innerHTML='<div class="scroll"><div class="pane-h" style="padding-left:0"><h1>Pulse</h1><div class="sub">Loading…</div></div></div>';loadStats().then(()=>{if(S.route==='pulse')render()});return}
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],today=new Date().toLocaleDateString('sv');
  let heat='<p class="muted">Loading GitHub activity…</p>',bars='';
  if(a&&a.weeks){let lm=-1;const day=d=>new Date(d+'T00:00');
    const months=a.weeks.map((w,i)=>{const m=day(w[0].date).getMonth();if(m===lm)return'';lm=m;return`<span style="grid-column:${i+1}">${M[m]}</span>`}).join('');
    const cells=a.weeks.map((w,i)=>w.map(d=>`<i class="l${d.level}${d.date===today?' today':''}" style="grid-column:${i+1};grid-row:${day(d.date).getDay()+1}" title="${d.count} commit${d.count===1?'':'s'} pushed on ${fmtDate(d.date)}"></i>`).join('')).join('');
    heat=`<div class="hmwrap" id="hmwrap"><div class="hmonths" style="grid-template-columns:repeat(${a.weeks.length},13px)">${months}</div><div class="hm">${cells}</div></div>
      <div class="legend" style="margin-top:10px;justify-content:flex-end">${a.error?`<span class="err" style="margin-right:auto">Showing saved data: ${esc(a.error)}</span>`:''}Less ${[0,1,2,3,4].map(n=>`<i style="background:var(--g${n});margin:0"></i>`).join('')} More <button class="btn sm" id="actRef">Refresh</button></div>`;
    const mx=Math.max(1,...a.repos.map(r=>r.count));
    bars=a.repos.length?a.repos.slice(0,10).map(r=>`<button class="b" data-repo="${esc(r.name)}" title="${esc(r.name)} · ${r.count} commits · open read-only view"><span>${r.private?'🔒 ':''}${esc(r.name.split('/')[1])}</span><span><div class="fill" style="width:${r.count/mx*100}%"></div></span><span class="n">${r.count}</span></button>`).join(''):'<p class="muted">No commits pushed in the last 30 days.</p>'}
  else if(a&&a.error)heat=`<p class="err">GitHub activity unavailable: ${esc(a.error)}</p><button class="btn sm" id="actRef">Retry</button>`;
  const w=s.weeks||[],fm=Math.max(1,...w.flatMap(x=>[x.captured,x.decided])),H=150,bw=20,gap=Math.max(52,Math.floor(520/Math.max(1,w.length)));
  const chart=`<svg class="chart" width="100%" viewBox="0 0 ${50+w.length*gap} 200" role="img" aria-label="Notes captured and decided per week">
    ${[0,.5,1].map(t=>`<line x1="34" x2="${50+w.length*gap}" y1="${170-t*H}" y2="${170-t*H}" stroke="var(--line2)" stroke-width="${t?1:1.5}"/><text x="28" y="${174-t*H}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(t*fm)}</text>`).join('')}
    ${w.map((x,i)=>{const X=48+i*gap,hc=x.captured/fm*H,hd=x.decided/fm*H,last=i===w.length-1,lbl=new Date(x.week+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
      return `<g><title>Week of ${lbl}: ${x.captured} captured, ${x.decided} decided</title><rect x="${X-4}" y="10" width="${bw*2+10}" height="160" fill="transparent"/>
      ${hc?`<rect x="${X}" y="${170-hc}" width="${bw}" height="${hc}" rx="4" fill="var(--s1)"/>`:''}${hd?`<rect x="${X+bw+2}" y="${170-hd}" width="${bw}" height="${hd}" rx="4" fill="var(--s2)"/>`:''}
      ${last?`<text x="${X+bw/2}" y="${164-hc}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink2)">${x.captured}</text><text x="${X+bw*1.5+2}" y="${164-hd}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink2)">${x.decided}</text>`:''}
      <text x="${X+bw}" y="190" text-anchor="middle" font-size="11" fill="var(--mute)">${lbl}</text></g>`}).join('')}</svg>`;
  $('#main').innerHTML=`<div class="scroll"><div class="pane-h" style="padding-left:0"><h1>Pulse</h1><div class="sub">Are notes turning into shipped work? Capture vs. decisions, and what reached GitHub.</div></div>
  <div class="tiles"><div class="card tile"><div class="num">${a&&a.total!==undefined?a.total:'–'}</div><div class="lab">commits pushed this year</div></div>
   <div class="card tile"><div class="num">${a&&a.active_days!==undefined?a.active_days:'–'}</div><div class="lab">active days</div></div>
   <div class="card tile"><div class="num">${a&&a.streak!==undefined?a.streak:'–'}<span style="font-size:20px;color:var(--mute)">d</span></div><div class="lab">current streak</div></div>
   <div class="card tile"><div class="num" style="color:${s.median_wait>7?'var(--rust)':'inherit'}">${s.median_wait==null?'–':s.median_wait}${s.median_wait==null?'':'<span style="font-size:20px;color:var(--mute)">d</span>'}</div><div class="lab">${s.error?`couldn't load: ${esc(s.error)}`:s.median_wait==null?'median wait in the Inbox (goal ≤ 7) · Inbox is empty':`median wait in the Inbox (goal ≤ 7) · oldest ${s.oldest}d · ${s.live} notes`}</div></div></div>
  <div class="card panel" style="margin-bottom:16px"><h3>Pushed to GitHub</h3><div class="cap">Your commits on default branches, last 52 weeks · private repos included · local-only repos never show</div>${heat}</div>
  <div class="pgrid"><div class="card panel"><h3>Inbox flow</h3><div class="cap">Notes captured vs. notes decided, per week (decisions from triage.log)</div>
    <div class="legend"><span><i style="background:var(--s1)"></i>Captured</span><span><i style="background:var(--s2)"></i>Decided</span></div>${chart}
    <details style="margin-top:8px;font-size:12.5px"><summary class="muted" style="cursor:pointer">Table</summary><table class="btable"><tr><td>Week of</td><td>Captured</td><td>Decided</td></tr>${w.map(x=>`<tr><td>${x.week}</td><td>${x.captured}</td><td>${x.decided}</td></tr>`).join('')}</table></details></div>
   <div class="card panel"><h3>Where the commits went</h3><div class="cap">Last ${a&&a.repo_days||30} days · click a repo to browse it</div><div class="bars">${bars}</div></div></div></div>`;
  const hw=$('#hmwrap');if(hw)hw.scrollLeft=hw.scrollWidth;
  $('#actRef')&&($('#actRef').onclick=async()=>{$('#actRef').disabled=true;await loadActivity(true);render()});
  $$('[data-repo]').forEach(b=>b.onclick=()=>openRepo(b.dataset.repo,'','pulse'))}

/* ---------- palette & keys ---------- */
let pal=null;
function closeOverlay(){$('#overlay').innerHTML='';pal=null}
function openKeys(){closeOverlay();$('#overlay').innerHTML=`<div class="scrim" id="scrim"><div class="card keys" style="background:var(--solid)"><h3>Keyboard</h3><table>
  ${[['J / K or ↓ / ↑','next / previous'],['P','Promote'],['R','Reference'],['C','Keep (cooking)'],['X','Kill'],['Enter','apply the open decision (Ctrl+Enter in a text box)'],['Esc','close the form / overlay'],['Z','undo the last change'],['Y','copy the note’s full path'],['/','search the list'],['Ctrl K','search everything + commands'],['1 2 3 4','Inbox · Projects · Archive · Pulse'],['?','this help']].map(([k,v])=>`<tr><td>${k.split(' ').map(x=>/^[A-Z↓↑]$|^[A-Za-z]{2,}$|^[\/?1-4]$/.test(x)?kb(x):x).join(' ')}</td><td>${v}</td></tr>`).join('')}</table></div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeOverlay()}}
function openPalette(){closeOverlay();pal={i:0,items:[]};
  $('#overlay').innerHTML=`<div class="scrim" id="scrim"><div class="pal"><div class="in">${I.search}<input id="pq" placeholder="Search notes, projects, commands…" autocomplete="off">${kb('Esc')}</div><div class="res" id="pres"></div>
   <div class="foot"><span>${kb('↑')} ${kb('↓')} move</span><span>${kb('↵')} open</span><span>${kb('Esc')} close</span></div></div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeOverlay()};
  const q=$('#pq');q.oninput=()=>{pal.i=0;palRender(q.value)};q.focus();palRender('')}
function palRender(q){q=q.trim().toLowerCase();const hit=s=>!q||s.toLowerCase().includes(q);const n=S.notes;
  const hl=s=>{const e=esc(s);if(!q)return e;const i=s.toLowerCase().indexOf(q);return i<0?e:esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))};
  const items=[];
  const notes=n.live.filter(x=>hit(x.title+' '+x.file)).slice(0,6);if(notes.length)items.push({h:'Inbox'},...notes.map(x=>({html:`${st(x.status)}<span class="grow">${hl(x.title)}</span><span class="muted">${x.age}d</span>`,go:()=>{location.hash='#/inbox';S.f={q:'',status:'all',type:null};S.sel=x.file;S.expanded=null;render()}})));
  const projs=projectCards().filter(c=>hit(c.title)).slice(0,4);if(projs.length)items.push({h:'Projects'},...projs.map(c=>({html:`${I.proj}<span class="grow">${hl(c.title)}</span><span class="muted">${c.f&&!c.f.done&&c.f.days_left!==null?(c.f.days_left<0?-c.f.days_left+'d late':c.f.days_left+'d left'):''}</span>`,go:()=>{S.psel=c.id;location.hash='#/projects';render()}})));
  const done=q?n.done.filter(x=>hit(x.title+' '+x.file)).slice(0,4):[];if(done.length)items.push({h:'Archive'},...done.map(x=>({html:`${st(x.fate)}<span class="grow">${hl(x.title)}</span>`,go:()=>{S.af={q:'',fate:'all'};S.asel=x.file;location.hash='#/archive';render()}})));
  const cmds=[['Go to Inbox',()=>location.hash='#/inbox','1'],['Go to Projects',()=>location.hash='#/projects','2'],['Go to Archive',()=>location.hash='#/archive','3'],['Go to Pulse',()=>location.hash='#/pulse','4'],
    ['Undo last change',doUndo,'Z'],['Toggle dark mode',toggleTheme,''],['Refresh everything',async()=>{S.projects=null;S.stats=null;await refresh();loadActivity(true);render()},''],['Keyboard shortcuts',openKeys,'?']].filter(c=>hit(c[0]));
  if(cmds.length)items.push({h:'Commands'},...cmds.map(([l,go,k])=>({html:`<span class="grow">${hl(l)}</span>${k?kb(k):''}`,go})));
  pal.items=items.filter(x=>!x.h);let idx=0;
  $('#pres').innerHTML=items.length?items.map(x=>x.h?`<div class="sect label">${x.h}</div>`:`<div class="r ${idx===pal.i?'on':''}" data-pi="${idx++}">${x.html}</div>`).join(''):'<div class="empty" style="font-size:16px">No matches.</div>';
  $$('#pres [data-pi]').forEach(r=>{r.onclick=()=>palGo(+r.dataset.pi);r.onmousemove=()=>{if(pal.i!==+r.dataset.pi){pal.i=+r.dataset.pi;$$('#pres .r').forEach(x=>x.classList.toggle('on',+x.dataset.pi===pal.i))}}})}
function palGo(i){const it=pal&&pal.items[i];closeOverlay();if(it)it.go()}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal?closeOverlay():openPalette();return}
  if($('#overlay').innerHTML){if(e.key==='Escape')closeOverlay();
    if(pal){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pal.i=Math.max(0,Math.min(pal.items.length-1,pal.i+(e.key==='ArrowDown'?1:-1)));$$('#pres .r').forEach(x=>x.classList.toggle('on',+x.dataset.pi===pal.i));$('#pres .r.on')?.scrollIntoView({block:'nearest'})}
      if(e.key==='Enter'){e.preventDefault();palGo(pal.i)}}return}
  const t=e.target instanceof Element?e.target:document.body;
  if(t.matches('input,textarea,select')){
    if(e.key==='Escape'){if(t.id==='q'){t.blur();return}if(S.mode){setMode(null);return}t.blur();return}
    if(e.key==='Enter'&&t.closest('#form')&&(t.tagName!=='TEXTAREA'||e.ctrlKey||e.metaKey)){e.preventDefault();apply()}
    if(e.key==='Enter'&&t.id==='q'){e.preventDefault();t.blur()}
    return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='/'){const q=$('#q');if(q){e.preventDefault();q.focus();q.select()}return}
  if(k==='?'){openKeys();return}
  if(k==='z'||k==='Z'){doUndo();return}
  if('1234'.includes(k)&&k.length===1){location.hash='#/'+['inbox','projects','archive','pulse'][+k-1];return}
  if(k==='Escape'){if(S.repo){S.repo=null;render()}else if(S.mode)setMode(null);else if(document.body.classList.contains('note')||document.body.classList.contains('detail'))backToList();else if(S.route==='projects'&&S.psel)selectProject(S.psel);return}
  const down=k==='j'||k==='ArrowDown',up=k==='k'||k==='ArrowUp';
  if(S.route==='inbox'&&S.notes){const ord=navOrder(inboxModel()),i=ord.indexOf(S.sel);
    if(down||up){e.preventDefault();const n=ord[i+(down?1:-1)];if(n)selectNote(n);return}
    if(t.closest&&t.closest('.opt,.seg,.btn'))if(k===' '||k==='Enter')return;
    if(k==='Enter'&&S.sel&&S.sel.startsWith('stack:')){apply();return}
    const m={p:'promote',r:'reference',c:'keep',x:'kill'}[k.toLowerCase()];if(m&&S.sel&&!S.sel.startsWith('stack:')){e.preventDefault();setMode(m);return}
    if(m&&S.sel&&S.sel.startsWith('stack:')){S.batchMode={promote:'merge',reference:'reference',keep:'keep',kill:'kill'}[m];renderBatch();return}
    if(k==='Enter'&&S.mode){apply();return}
    if(k==='y'){const el=$('#doc [data-copy]');if(el)copyPath(el.dataset.copy,el)}return}
  if(S.route==='archive'&&S.notes){const items=$$('#list [data-f]').map(r=>r.dataset.f),i=items.indexOf(S.asel);
    if(down||up){e.preventDefault();const n=items[i+(down?1:-1)];if(n){selectArchive(n);$('#list .sel')?.scrollIntoView({block:'nearest'})}return}
    if(k==='y'){const el=$('#doc [data-copy]');if(el)copyPath(el.dataset.copy,el)}return}
  if(S.route==='projects'&&!S.repo){const ids=$$('[data-pid]').map(b=>b.dataset.pid),i=ids.indexOf(S.psel);
    if(down||up){e.preventDefault();const n=ids[i+(down?1:-1)];if(n)selectProject(n)}
    if(k==='y'){const el=$('#drawer [data-copy]');if(el)copyPath(el.dataset.copy,el)}}});

/* ---------- routing ---------- */
function render(){
  if(!S.notes){$('#main').innerHTML='<div class="empty">Loading…</div>';return}
  renderRail();
  if(S.repo&&S.repo.from===S.route)return renderRepo();S.repo=null;
  ({inbox:renderInbox,projects:renderProjects,archive:renderArchive,pulse:renderPulse}[S.route]||renderInbox)()}
function route(){const r=(location.hash.match(/^#\/(\w+)/)||[])[1];const nr=['inbox','projects','archive','pulse'].includes(r)?r:'inbox';
  if(nr!==S.route){S.mode=null;S.repo=null;document.body.classList.remove('note','detail')}S.route=nr;render()}
addEventListener('hashchange',route);
$('#mPal').onclick=openPalette;$('#mPal').innerHTML=I.search;
// coming back to the tab (or the phone app) picks up notes changed elsewhere, unless you're mid-decision
// a tab left open across a restart (or an old server still running) talks to a different API: say so
async function checkVersion(){try{const v=await api('/api/version');let b=$('#vbanner');
  if(v.version===VERSION){b&&b.remove();return}
  if(!b){b=document.createElement('div');b.id='vbanner';b.setAttribute('role','alert');document.body.prepend(b)}
  b.innerHTML=`This page is v${esc(VERSION)} but the server is v${esc(v.version)} (started ${esc(v.started.replace('T',' '))}). <button onclick="location.reload()">Reload the page</button>`}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion()});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||S.mode||$('#overlay').innerHTML)return;
  try{await refresh();if(!(S.route==='inbox'&&S.sel&&S.sel.startsWith('stack:')))render()}catch(e){}});
(async()=>{try{await loadNotes()}catch(e){$('#main').innerHTML=`<div class="empty">Can't reach the triage server: ${esc(e.message)}</div>`;return}
  route();loadActivity();checkVersion();setInterval(()=>loadActivity(),600000)})();
</script></body></html>
